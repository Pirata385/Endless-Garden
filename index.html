<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#061510">
<meta name="description" content="Endless Garden: a procedural botanical game of 45-gene plants, rarity tiers, and hybridization.">

<title>Endless Garden</title>
<style>
/* ---------- Design tokens: one dark botanical theme ---------- */
:root {
  --bg0: #061510;
  --bg1: #0c2319;
  --bg2: #163d2e;
  --ink: #f2f6ea;
  --ink-2: #c3d4c0;
  --ink-3: #8aa48f;
  --gold: #e9c977;
  --gold-2: #b98f45;
  --line: rgba(233, 201, 119, 0.2);
  --card: rgba(255, 255, 255, 0.045);
  --glass: rgba(7, 24, 18, 0.88);
  --tier-common: #a9bcae;
  --tier-uncommon: #86e09a;
  --tier-rare: #6cc9ee;
  --tier-epic: #bb97ff;
  --tier-legendary: #ffd27a;
  --tier-mythic: #ff86e0;
  --radius: 20px;
  --touch: 48px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ---------- Base and shell ---------- */
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg0);
  background-image:
    radial-gradient(120% 70% at 50% -12%, #1f4d38 0%, rgba(31, 77, 56, 0) 62%),
    radial-gradient(90% 60% at 100% 112%, #143d2d 0%, rgba(20, 61, 45, 0) 60%),
    linear-gradient(180deg, #0c2319 0%, var(--bg0) 72%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  overscroll-behavior: none;
}
#app { position: fixed; inset: 0; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.noscript { padding: 24px; text-align: center; font-family: var(--serif); }

.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 14px) calc(var(--safe-l) + 16px);
  opacity: 0; visibility: hidden; transform: translateY(12px);
  transition: opacity .42s ease, transform .42s ease, visibility 0s linear .42s;
}
.screen.active { opacity: 1; visibility: visible; transform: none; transition: opacity .42s ease, transform .42s ease, visibility 0s; }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand-block { min-width: 0; }
.brand { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 7vw, 36px); letter-spacing: 0.01em; color: var(--ink); }
.title { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 24px; }
.sub { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.icon-btn {
  width: var(--touch); height: var(--touch); display: inline-grid; place-items: center; flex: 0 0 auto;
  border-radius: 50%; font-size: 26px; line-height: 1; background: var(--card); border: 1px solid var(--line);
}
.overlay {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  background: rgba(3, 12, 8, 0.78);
}
.toast {
  position: fixed; left: 50%; bottom: calc(var(--safe-b) + 22px); z-index: 80;
  transform: translate(-50%, 16px); max-width: min(92vw, 420px); padding: 12px 18px;
  border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
  color: var(--ink); font-size: 14px; text-align: center; opacity: 0; pointer-events: none;
  transition: opacity .3s ease, transform .3s ease;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .screen, .toast { transition: none !important; } }

<body>
<noscript><p class="noscript">Endless Garden needs JavaScript to grow.</p></noscript>
<div id="app">

    <!-- @@html:settings -->

</div>

<script>
'use strict';
/*
 * Endless Garden: one file, labelled sections.
 * Genetics, Naming, Layout, Renderer, Loop, Store, UI.
 * window.EndlessGarden (alias EG) exposes helpers for automated checks.
 */
const EG = (window.EndlessGarden = window.EndlessGarden || {});

/* ===== Genetics ===== */
/* ---------- Gene catalogue (spec Appendix A) ---------- */
// Weights are relative percentages. GENES normalizes them per gene into probabilities p.
const GENE_GROUPS = Object.freeze([
  Object.freeze({ id: 'trunk', label: 'Trunk', count: 9 }),
  Object.freeze({ id: 'foliage', label: 'Foliage', count: 9 }),
  Object.freeze({ id: 'flower', label: 'Flowers', count: 7 }),
  Object.freeze({ id: 'fruit', label: 'Fruit and seed', count: 5 }),
  Object.freeze({ id: 'form', label: 'Form', count: 4 }),
  Object.freeze({ id: 'special', label: 'Special', count: 6 }),
  Object.freeze({ id: 'unique', label: 'Unique', count: 5 }),
]);
const GENE_COUNT = 45;

// [key, label, group id, [[allele name, weight], ...]]
const GENE_DATA = [
  ['trunkThickness', 'Trunk thickness', 'trunk', [['Slender', 25], ['Sturdy', 35], ['Thick', 25], ['Stout', 12], ['Massive Trunk', 3]]],
  ['trunkHeight', 'Trunk height', 'trunk', [['Stunted', 10], ['Low', 20], ['Medium', 35], ['Tall', 25], ['Towering', 8], ['Skyward', 2]]],
  ['barkTexture', 'Bark texture', 'trunk', [['Smooth', 20], ['Furrowed', 30], ['Scaled', 15], ['Papery', 15], ['Mossy', 12], ['Gnarled', 8]]],
  ['trunkColor', 'Bark color', 'trunk', [['Umber', 30], ['Ash Grey', 20], ['Silver', 12], ['Mahogany', 18], ['Ivory', 8], ['Obsidian', 7], ['Moonstone', 3], ['Sun-Gilded', 2]]],
  ['branching', 'Branching', 'trunk', [['Single Stem', 8], ['Forked', 30], ['Open Crown', 25], ['Dense Branching', 20], ['Candelabra', 10], ['Spiral Branching', 7]]],
  ['aerialRoots', 'Aerial roots', 'trunk', [['None', 60], ['Few', 25], ['Dangling', 10], ['Cascading', 5]]],
  ['buttressRoots', 'Buttress roots', 'trunk', [['None', 55], ['Low Buttress', 30], ['Great Buttress', 12], ['Cathedral Roots', 3]]],
  ['trunkCount', 'Trunk count', 'trunk', [['Single', 70], ['Twin', 20], ['Triple', 8], ['Clustered', 2]]],
  ['trunkTwist', 'Trunk shape', 'trunk', [['Straight', 50], ['Gentle Curve', 28], ['Twisted', 15], ['Corkscrew', 5], ['Ancient Spiral', 2]]],

  ['leafShape', 'Leaf shape', 'foliage', [['Oval', 22], ['Heart', 18], ['Lanceolate', 16], ['Palmate', 12], ['Round', 14], ['Feathery', 10], ['Star-Lobed', 6], ['Ginkgo Fan', 2]]],
  ['leafSize', 'Leaf size', 'foliage', [['Tiny', 15], ['Small', 25], ['Medium', 30], ['Large', 20], ['Enormous', 10]]],
  ['foliageDensity', 'Foliage density', 'foliage', [['Sparse', 15], ['Airy', 25], ['Lush', 35], ['Dense', 18], ['Impenetrable', 7]]],
  ['leafPalette', 'Leaf palette', 'foliage', [['Verdant', 25], ['Sage', 18], ['Jade', 14], ['Olive', 12], ['Emerald', 10], ['Teal', 8], ['Plum', 4], ['Crimson', 3], ['Amber', 3], ['Silver-Blue', 2], ['Violet', 1]]],
  ['seasonalShift', 'Seasonal shift', 'foliage', [['Evergreen', 40], ['Autumn Blush', 25], ['Dawn Gradient', 15], ['Frostbitten', 11.5], ['Blossom Cycle', 6.7], ['Golden Leaves', 1.8]]],
  ['leafArrangement', 'Leaf arrangement', 'foliage', [['Alternate', 35], ['Opposite', 25], ['Whorled', 15], ['Rosette', 12], ['Spiraled', 9], ['Clustered', 4]]],
  ['foliageType', 'Foliage type', 'foliage', [['Broadleaf', 50], ['Needle', 25], ['Scale', 10], ['Fern Frond', 10], ['Ribbon', 4], ['Glass Needle', 1]]],
  ['crownPattern', 'Crown pattern', 'foliage', [['Clumped', 25], ['Even Spread', 25], ['Tiered Leaves', 15], ['Wispy', 15], ['Tufted', 10], ['Veiled', 10]]],
  ['leafEdge', 'Leaf edge', 'foliage', [['Smooth', 40], ['Serrated', 25], ['Lobed', 15], ['Frilled', 10], ['Spiked Edge', 7], ['Lace', 3]]],

  ['flowerPresence', 'Flowering', 'flower', [['None', 30], ['Sparse', 25], ['Common', 25], ['Profuse', 15], ['Overwhelming', 5]]],
  ['flowerSize', 'Flower size', 'flower', [['Tiny', 30], ['Small', 30], ['Medium', 25], ['Large', 12], ['Giant Blossom', 3]]],
  ['petalCount', 'Petal count', 'flower', [['3', 15], ['5', 35], ['8', 20], ['12', 15], ['20', 8], ['40', 5], ['Fractal', 2]]],
  ['flowerColor', 'Flower color', 'flower', [['White', 18], ['Pink', 18], ['Lilac', 12], ['Yellow', 14], ['Coral', 10], ['Red', 8], ['Blue', 8], ['Indigo', 4], ['Silver', 3], ['Black Velvet', 2], ['Opal', 2], ['Rainbow', 1]]],
  ['bloomStyle', 'Bloom style', 'flower', [['Open Cup', 30], ['Bell', 20], ['Star', 20], ['Tubular', 12], ['Spiral Bloom', 9], ['Cluster Spray', 9]]],
  ['fragrance', 'Fragrance', 'flower', [['Faint', 35], ['Sweet', 25], ['Spiced', 15], ['Heady', 12], ['Resinous', 8], ['Mystic', 5]]],
  ['bioluminescentFlowers', 'Bioluminescent flowers', 'flower', [['None', 99.3], ['Bioluminescent', 0.7]]],

  ['fruitType', 'Fruit type', 'fruit', [['None', 30], ['Berries', 20], ['Pods', 12], ['Drupes', 10], ['Orbs', 10], ['Nuts', 8], ['Starfruit', 6], ['Lanterns', 4]]],
  ['fruitColor', 'Fruit color', 'fruit', [['Scarlet', 22], ['Gold', 18], ['Violet', 14], ['Cream', 12], ['Blue-black', 12], ['Pearl', 8], ['Ruby', 6], ['Ember Glow', 4], ['Jade', 4]]],
  ['fruitSize', 'Fruit size', 'fruit', [['Tiny', 35], ['Small', 30], ['Medium', 20], ['Large', 12], ['Huge', 3]]],
  ['fruitCount', 'Fruit count', 'fruit', [['Single', 25], ['Handful', 30], ['Bunches', 25], ['Abundant', 15], ['Bountiful', 5]]],
  ['fruitArrangement', 'Fruit arrangement', 'fruit', [['Scattered', 30], ['Hanging', 25], ['Crowned', 15], ['Garland', 15], ['Spiral', 10], ['Constellation', 5]]],

  ['silhouette', 'Silhouette', 'form', [['Upright', 20], ['Weeping', 14], ['Sprawling', 14], ['Columnar', 12], ['Umbrella', 12], ['Bonsai', 10], ['Cloud-Dome', 9], ['Spiral Spire', 5], ['Hanging Tiers', 4]]],
  ['lean', 'Lean', 'form', [['Straight', 60], ['Leaning', 25], ['Heavy Lean', 10], ['Zigzag', 5]]],
  ['symmetry', 'Symmetry', 'form', [['Symmetrical', 55], ['Asymmetrical', 35], ['Chaotic', 10]]],
  ['canopyTiers', 'Canopy tiers', 'form', [['Single Layer', 45], ['Two Tiers', 30], ['Three Tiers', 15], ['Pagoda', 8], ['Floating Tiers', 2]]],

  ['glowAura', 'Aura', 'special', [['None', 90], ['Faint Halo', 6], ['Ember Glow', 2.5], ['Moonlight Aura', 1.5]]],
  ['crystalline', 'Crystalline', 'special', [['None', 93], ['Crystal Tips', 5], ['Crystal Veins', 1.8], ['Fully Crystalline', 0.2]]],
  ['floating', 'Floating', 'special', [['Grounded', 96], ['Hovering Roots', 2.5], ['Levitating', 1.2], ['Ethereal Float', 0.3]]],
  ['ethereal', 'Ethereal', 'special', [['Solid', 93], ['Misty', 5], ['Phantom', 1.8], ['Spectral', 0.2]]],
  ['ancient', 'Age', 'special', [['Young', 60], ['Mature', 25], ['Aged', 10], ['Ancient', 4], ['Primordial', 1]]],
  ['symbiosis', 'Symbiosis', 'special', [['None', 80], ['Vine-Covered', 10], ['Mushroom Caps', 6], ['Mushroom Symbiont', 3], ['Lichen Crown', 1]]],

  ['thorns', 'Thorns', 'unique', [['None', 62], ['Few Thorns', 18], ['Thorny', 12], ['Spiny', 6], ['Razor Thorns', 2]]],
  ['particleEffect', 'Particles', 'unique', [['None', 70], ['Pollen', 12], ['Falling Petals', 8], ['Glowing Spores', 5], ['Light Rays', 3], ['Fireflies', 1.5], ['Starlight Motes', 0.5]]],
  ['barkPattern', 'Bark pattern', 'unique', [['Plain', 35], ['Spotted', 20], ['Striped', 15], ['Runic', 10], ['Eye Knots', 6], ['Marbled', 9], ['Veined Glow', 5]]],
  ['leafGradient', 'Leaf gradient', 'unique', [['Mono', 45], ['Two-tone', 30], ['Radial', 15], ['Iridescent', 8], ['Aurora', 2]]],
  ['mossCover', 'Moss cover', 'unique', [['Bare', 45], ['Patchy Moss', 25], ['Lush Moss', 15], ['Lichen Shelves', 8], ['Velvet Moss', 5], ['Glowing Moss', 2]]],
];

// Derive per-allele probability p = w / sum(w) within the gene, and bits = -log2(p).
const GENES = Object.freeze(GENE_DATA.map(([key, label, group, rows], i) => {
  const total = rows.reduce((sum, row) => sum + row[1], 0);
  const alleles = rows.map(([name, w], j) => {
    const p = w / total;
    return Object.freeze({ i: j, name, w, p, bits: -Math.log2(p) });
  });
  return Object.freeze({ i, key, label, group, alleles: Object.freeze(alleles) });
}));
if (GENES.length !== GENE_COUNT) throw new Error(`gene catalogue has ${GENES.length} genes, expected ${GENE_COUNT}`);

EG.GENE_GROUPS = GENE_GROUPS;
EG.GENE_COUNT = GENE_COUNT;
EG.GENES = GENES;

/* ---------- Seeded randomness and hashing ---------- */
// mulberry32: small and fast. Each call returns a number in [0, 1).
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// FNV-1a, 32-bit. Seeds the layout and the name from a genome.
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

/* ---------- Sampling, rarity, and tiers ---------- */
// Draw one allele per gene, each by its weight.
function sampleGenome(rng) {
  return GENES.map((gene) => {
    const r = rng();
    let acc = 0;
    for (const allele of gene.alleles) {
      acc += allele.p;
      if (r < acc) return allele.i;
    }
    return gene.alleles[gene.alleles.length - 1].i;
  });
}

// Tier thresholds on the 0 to 100 rarity score (spec section 5).
const TIERS = Object.freeze([
  Object.freeze({ id: 'common', label: 'Common', min: 0 }),
  Object.freeze({ id: 'uncommon', label: 'Uncommon', min: 60 }),
  Object.freeze({ id: 'rare', label: 'Rare', min: 85 }),
  Object.freeze({ id: 'epic', label: 'Epic', min: 95 }),
  Object.freeze({ id: 'legendary', label: 'Legendary', min: 99 }),
  Object.freeze({ id: 'mythic', label: 'Mythic', min: 99.7 }),
]);

// Count of sorted values <= x (binary search for the upper bound).
function countAtMost(sorted, x) {
  let lo = 0;
  let hi = sorted.length;
  while (lo < hi) {
    const mid = (lo + hi) >>> 1;
    if (sorted[mid] <= x) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

// Calibration population: 10,000 random genomes from a fixed seed, sorted once at load.
const CAL = (() => {
  const rng = rngFrom(0x5eed);
  const bits = new Float64Array(10000);
  for (let k = 0; k < bits.length; k++) {
    const genes = sampleGenome(rng);
    let total = 0;
    for (let i = 0; i < GENE_COUNT; i++) total += GENES[i].alleles[genes[i]].bits;
    bits[k] = total;
  }
  return bits.sort();
})();

// Analyze a genome: alleles, surprisal in bits, score and tier, seed, and notable traits (p < 0.12).
function analyze(genes) {
  if (!Array.isArray(genes) || genes.length !== GENE_COUNT) throw new Error(`analyze expects ${GENE_COUNT} allele indices`);
  const alleles = GENES.map((gene, i) => {
    const allele = gene.alleles[genes[i]];
    if (!allele) throw new Error(`gene ${gene.key} has no allele ${genes[i]}`);
    return allele;
  });
  const bits = alleles.reduce((sum, a) => sum + a.bits, 0);
  const score = (100 * countAtMost(CAL, bits)) / CAL.length;
  const tier = TIERS.reduce((best, t) => (score >= t.min ? t : best), TIERS[0]);
  const notable = [];
  GENES.forEach((gene, i) => {
    if (alleles[i].p < 0.12) notable.push({ gene, allele: alleles[i] });
  });
  notable.sort((x, y) => x.allele.w - y.allele.w);
  return {
    alleles,
    bits,
    score,
    tier: { id: tier.id, label: tier.label },
    seed: fnv1a(genes.join(',')),
    notable,
  };
}

EG.rngFrom = rngFrom;
EG.fnv1a = fnv1a;
EG.sampleGenome = sampleGenome;
EG.analyze = analyze;
EG.TIERS = TIERS;
EG.CAL = CAL;

/* @@js:genetics */

/* ===== Naming ===== */
/* ---------- Procedural names (spec section 7) ---------- */
// Genus = prefix + suffix. Pure plants may take an adjective epithet, placed before the genus.
// Legendary and Mythic always take a legend phrase, placed after the genus.
const PREFIXES = Object.freeze(['Lumi', 'Shade', 'Ember', 'Moon', 'Silk', 'Thorn', 'Aster', 'Velvet', 'Nyx', 'Cinder', 'Frost', 'Ivy', 'Sable', 'Gilt', 'Mire', 'Opal', 'Briar', 'Halo', 'Dusk', 'Pearl', 'Wisp', 'Ash', 'Rune', 'Fern', 'Lark', 'Myrrh', 'Sol', 'Tide', 'Vale', 'Corin', 'Amara', 'Ilex', 'Selene', 'Vesper', 'Lysa', 'Maren', 'Oriel', 'Quill', 'Ravel', 'Sylva']);
const SUFFIXES = Object.freeze(['nara', 'veil', 'root', 'thorn', 'bloom', 'wisp', 'glade', 'dew', 'crest', 'spire', 'lune', 'mere', 'frond', 'bark', 'ling', 'ora', 'ia', 'ell', 'orn', 'wyn', 'loom', 'gleam', 'mantle', 'hollow', 'bell', 'tide', 'fall', 'whisper', 'ana', 'ine', 'ara']);
const EPITHETS = Object.freeze(['Gentle', 'Quiet', 'Silver', 'Wild', 'Hollow', 'Amber', 'Pale', 'Gilded', 'Hushed', 'Sunward', 'Starlit', 'Tidal', 'Mistbound', 'Verdant', 'Nightbloom', 'Ashen', 'Pearled', 'Lantern', 'Dawnlit', 'Moonlit', 'Rimed', 'Glasswing', 'Umbral', 'Candled', 'Emberlit']);
const LEGEND_EPITHETS = Object.freeze(['of the Hollow Sun', 'the Everbloom', 'of Forgotten Dawns', 'the Starbearer', 'of the Deep Glade', 'Eternal', 'of the Vesper Gate', 'the Unfading']);

function pick(rng, list) {
  return list[Math.floor(rng() * list.length)];
}

function genusText(genus) {
  return genus.pre + genus.suf;
}

// Epithet rules: Legendary and Mythic always take a legend phrase; other tiers take an adjective 45% of the time.
function applyEpithet(base, tierId, rng) {
  if (tierId === 'legendary' || tierId === 'mythic') return `${base} ${pick(rng, LEGEND_EPITHETS)}`;
  if (rng() < 0.45) return `${pick(rng, EPITHETS)} ${base}`;
  return base;
}

// Pure plant name. A pure function of the genome seed, so one genome always gets one name.
function pureName(analysis) {
  const rng = rngFrom(fnv1a(`name:${analysis.seed}`));
  const genus = { pre: pick(rng, PREFIXES), suf: pick(rng, SUFFIXES) };
  return { name: applyEpithet(genusText(genus), analysis.tier.id, rng), genus };
}

// Hybrid name. Half the time "A × B" from the parents' genera; otherwise a blended genus.
// The hybrid genus is always the parents' blend (A's prefix + B's suffix), so later crosses keep it.
function hybridName(recordA, recordB, analysis, rng) {
  const genus = { pre: recordA.genus.pre, suf: recordB.genus.suf };
  if (rng() < 0.5) {
    const pair = `${genusText(recordA.genus)} × ${genusText(recordB.genus)}`;
    const legendary = analysis.tier.id === 'legendary' || analysis.tier.id === 'mythic';
    return { name: legendary ? `${pair} ${pick(rng, LEGEND_EPITHETS)}` : pair, genus };
  }
  return { name: applyEpithet(genusText(genus), analysis.tier.id, rng), genus };
}

EG.PREFIXES = PREFIXES;
EG.SUFFIXES = SUFFIXES;
EG.EPITHETS = EPITHETS;
EG.LEGEND_EPITHETS = LEGEND_EPITHETS;
EG.pureName = pureName;
EG.hybridName = hybridName;
