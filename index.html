function scheduleThumbs() {
  if (thumbFrame) return;
  thumbFrame = requestAnimationFrame(() => {
    thumbFrame = 0;
    for (let k = 0; k < 2 && thumbQueue.length; k++) {
      const { img, record } = thumbQueue.shift();
      img.src = renderThumb(record);
    }
    if (thumbQueue.length) scheduleThumbs();
  });
}

// Infinite scroll: when the sentinel comes into view, the next page of cards is added.
function onSentinel(entries) {
  if (!entries.some((e) => e.isIntersecting)) return;
  if (galleryState.shown >= visibleList().length) return;
  galleryState.shown += galleryState.pageSize;
  paintGrid();
}

function onCardTap(id) {
  openActions(id);
}

function toggleFavorite(id) {
  const record = Store.get(id);
  if (!record) return;
  Store.update(id, { fav: !record.fav });
  buzz([6]);
  refreshGallery();
}

function makeButton(label, className, id, type = 'button') {
  const b = document.createElement('button');
  b.type = type;
  b.className = className;
  b.id = id;
  b.textContent = label;
  return b;
}

// Bottom sheet with actions for one specimen. A tap disables the sheet, then runs the action after it closes.
function closeSheet() {
  const sheet = $('sheet');
  sheet.hidden = true;
  sheet.textContent = '';
}

function openSheet(record, actions) {
  const sheet = $('sheet');
  sheet.textContent = '';
  const card = document.createElement('div');
  card.className = 'sheet-card';
  const title = document.createElement('p');
  title.className = 'sheet-title';
  title.textContent = record.name;
  card.append(title);
  const buttons = actions.map((action) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `sheet-action${action.danger ? ' danger' : ''}`;
    b.dataset.action = action.id;
    b.textContent = action.label;
    b.addEventListener('click', () => {
      if (buttons.some((x) => x.disabled)) return;
      buttons.forEach((x) => {
        x.disabled = true;
      });
      setTimeout(() => {
        closeSheet();
        action.run();
      }, 120);
    });
    card.append(b);
    return b;
  });
  sheet.append(card);
  sheet.hidden = false;
}

function openActions(id) {
  const record = Store.get(id);
  if (!record) return;
  openSheet(record, [
    { id: 'rename', label: 'Rename', run: () => renameSpecimen(id) },
    { id: 'favorite', label: record.fav ? 'Remove from favorites' : 'Add to favorites', run: () => toggleFavorite(id) },
    { id: 'delete', label: 'Delete', danger: true, run: () => deleteSpecimen(id) },
  ]);
}

// Dialog host. The first answer wins: buttons disable at once, and the dialog hides after a short delay,
// so a double tap cannot reach the page underneath.
function openDialog(card, onAnswer) {
  const box = $('dialog');
  box.textContent = '';
  box.append(card);
  box.hidden = false;
  let answered = false;
  const onKey = (e) => {
    if (e.key === 'Escape') answer(null);
  };
  const answer = (value) => {
    if (answered) return;
    answered = true;
    card.querySelectorAll('button').forEach((b) => {
      b.disabled = true;
    });
    setTimeout(() => {
      box.hidden = true;
      box.textContent = '';
      box.removeEventListener('keydown', onKey);
      onAnswer(value);
    }, 200);
  };
  box.addEventListener('keydown', onKey);
  return answer;
}

// Rename prompt. Resolves with the typed text, or null when cancelled.
function promptText({ title, value = '', max = 40 }) {
  return new Promise((resolve) => {
    const heading = document.createElement('h3');
    heading.id = 'dialog-title';
    heading.textContent = title;
    const input = document.createElement('input');
    input.id = 'dlgInput';
    input.type = 'text';
    input.maxLength = max;
    input.value = value;
    input.autocomplete = 'off';
    input.setAttribute('aria-labelledby', 'dialog-title');
    const actions = document.createElement('div');
    actions.className = 'dialog-actions';
    const cancel = makeButton('Cancel', 'btn-secondary', 'dlgCancel');
    const ok = makeButton('Save', 'btn-primary', 'dlgOk', 'submit');
    actions.append(cancel, ok);
    const form = document.createElement('form');
    form.className = 'dialog-card';
    form.append(heading, input, actions);
    const answer = openDialog(form, (text) => resolve(text));
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      answer(input.value);
    });
    cancel.addEventListener('click', () => answer(null));
    input.focus();
    input.select();
  });
}

// Confirm prompt. Resolves true only when the confirm button is chosen.
function confirmDialog({ title, message, confirmLabel = 'Confirm' }) {
  return new Promise((resolve) => {
    const heading = document.createElement('h3');
    heading.id = 'dialog-title';
    heading.textContent = title;
    const text = document.createElement('p');
    text.className = 'dialog-text';
    text.textContent = message;
    const cancel = makeButton('Cancel', 'btn-secondary', 'dlgCancel');
    const ok = makeButton(confirmLabel, 'btn-danger', 'dlgOk');
    const actions = document.createElement('div');
    actions.className = 'dialog-actions';
    actions.append(cancel, ok);
    const card = document.createElement('div');
    card.className = 'dialog-card';
    card.append(heading, text, actions);
    const answer = openDialog(card, (yes) => resolve(yes === true));
    cancel.addEventListener('click', () => answer(false));
    ok.addEventListener('click', () => answer(true));
    cancel.focus();
  });
}

async function renameSpecimen(id) {
  const record = Store.get(id);
  if (!record) return;
  const text = await promptText({ title: 'Rename specimen', value: record.name, max: 40 });
  if (text === null) return;
  const next = text.trim().slice(0, 40);
  if (!next || !Store.get(id)) return; // an empty name keeps the old one
  Store.update(id, { name: next });
  refreshGallery();
  showToast('Renamed');
}

async function deleteSpecimen(id) {
  const record = Store.get(id);
  if (!record) return;
  const ok = await confirmDialog({
    title: 'Delete this specimen?',
    message: `${record.name} will leave your gallery. This cannot be undone.`,
    confirmLabel: 'Delete',
  });
  if (!ok || !Store.get(id)) return;
  Store.remove(id);
  analysisCache.delete(id);
  buzz([18, 30, 18]);
  refreshGallery();
  showToast(`${record.name} was deleted`);
}

// Breed mode and the detail view both open from here. The gallery opens with its filters and sort kept.
function openGallery(opts = {}) {
  galleryState.breed = Boolean(opts.breed);
  go('gallery');
}

function initGallery() {
  cardObserver = new IntersectionObserver(onCardsVisible, { root: $('gGrid'), rootMargin: '240px' });
  pageObserver = new IntersectionObserver(onSentinel, { root: $('gGrid'), rootMargin: '200px' });
  $('gSearch').addEventListener(
    'input',
    debounce(() => {
      galleryState.query = $('gSearch').value;
      galleryState.shown = galleryState.pageSize;
      paintGrid();
    }, 120),
  );
  $('gSort').addEventListener('change', () => {
    galleryState.sort = $('gSort').value;
    galleryState.shown = galleryState.pageSize;
    paintGrid();
  });
  $('sheet').addEventListener('click', (e) => {
    if (e.target === $('sheet')) closeSheet();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('sheet').hidden) closeSheet();
  });
}

function init() {
  homeView = new PlantView($('homeCanvas'), {});
  revealView = new PlantView($('rvCanvas'), {});
  $('btnGenerate').addEventListener('click', generateFlow);
  $('rvSave').addEventListener('click', saveReveal);
  $('rvAgain').addEventListener('click', () => {
    closeReveal();
    generateFlow();
  });
  $('rvClose').addEventListener('click', closeReveal);
  document.querySelectorAll('[data-nav]').forEach((el) => {
    el.addEventListener('click', () => go(el.dataset.nav));
  });
  window.addEventListener('resize', () => {
    if (screenEls.home.classList.contains('active')) homeView.resize();
    if (reveal) revealView.resize();
  });
  initGallery();
  go('home');
}

EG.closeReveal = closeReveal;

EG.go = go;
EG.openGallery = openGallery;
EG.visibleList = visibleList;
EG.openSheet = openSheet;
EG.promptText = promptText;
EG.confirmDialog = confirmDialog;
EG.galleryState = galleryState;
EG.breedState = breedState;

init();
