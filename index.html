<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061510">
<meta name="description" content="Endless Garden: a procedural botanical game of 45-gene plants, rarity tiers, and hybridization.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M12 52C12 26 28 12 54 10c-2 26-16 42-42 42z' fill='%23e9c977'/%3E%3C/svg%3E">
<title>Endless Garden</title>
<style>
/* ---------- Design tokens: one dark botanical theme ---------- */
:root {
  --bg0: #061510;
  --bg1: #0c2319;
  --bg2: #163d2e;
  --ink: #f2f6ea;
  --ink-2: #c3d4c0;
  --ink-3: #8aa48f;
  --gold: #e9c977;
  --gold-2: #b98f45;
  --line: rgba(233, 201, 119, 0.2);
  --card: rgba(255, 255, 255, 0.045);
  --glass: rgba(7, 24, 18, 0.88);
  --tier-common: #a9bcae;
  --tier-uncommon: #86e09a;
  --tier-rare: #6cc9ee;
  --tier-epic: #bb97ff;
  --tier-legendary: #ffd27a;
  --tier-mythic: #ff86e0;
  --radius: 20px;
  --touch: 48px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ---------- Base and shell ---------- */
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg0);
  background-image:
    radial-gradient(120% 70% at 50% -12%, #1f4d38 0%, rgba(31, 77, 56, 0) 62%),
    radial-gradient(90% 60% at 100% 112%, #143d2d 0%, rgba(20, 61, 45, 0) 60%),
    linear-gradient(180deg, #0c2319 0%, var(--bg0) 72%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  overscroll-behavior: none;
}
#app { position: fixed; inset: 0; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.noscript { padding: 24px; text-align: center; font-family: var(--serif); }

.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 14px) calc(var(--safe-l) + 16px);
  opacity: 0; visibility: hidden; transform: translateY(12px);
  transition: opacity .42s ease, transform .42s ease, visibility 0s linear .42s;
}
.screen.active { opacity: 1; visibility: visible; transform: none; transition: opacity .42s ease, transform .42s ease, visibility 0s; }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand-block { min-width: 0; }
.brand { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 7vw, 36px); letter-spacing: 0.01em; color: var(--ink); }
.title { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 24px; }
.sub { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.icon-btn {
  width: var(--touch); height: var(--touch); display: inline-grid; place-items: center; flex: 0 0 auto;
  border-radius: 50%; font-size: 26px; line-height: 1; background: var(--card); border: 1px solid var(--line);
}
.overlay {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  background: rgba(3, 12, 8, 0.78);
}
.toast {
  position: fixed; left: 50%; bottom: calc(var(--safe-b) + 22px); z-index: 80;
  transform: translate(-50%, 16px); max-width: min(92vw, 420px); padding: 12px 18px;
  border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
  color: var(--ink); font-size: 14px; text-align: center; opacity: 0; pointer-events: none;
  transition: opacity .3s ease, transform .3s ease;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .screen, .toast { transition: none !important; } }

/* ---------- Home ---------- */
.home-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.specimen {
  position: relative; width: min(80vw, 44vh, 380px); aspect-ratio: 1; border-radius: 28px; overflow: hidden;
  background: radial-gradient(circle at 50% 42%, rgba(233, 201, 119, 0.1), rgba(233, 201, 119, 0) 62%), rgba(255, 255, 255, 0.025);
  border: 1px solid var(--line); box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.35);
}
.specimen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.specimen-caption {
  position: absolute; left: 12px; right: 12px; bottom: 10px; margin: 0; text-align: center;
  font-family: var(--serif); font-size: 15px; color: var(--ink-2); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
}
.btn-generate {
  min-width: min(86vw, 340px); min-height: 76px; padding: 14px 28px; border-radius: 999px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #0c2319;
  background: linear-gradient(180deg, #f3dc9a, #d9b35f);
  box-shadow: 0 12px 34px rgba(233, 201, 119, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  transition: transform 0.16s ease, box-shadow 0.2s ease;
}
.btn-generate:active { transform: scale(0.98); }
.btn-generate .gen-label { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: 0.01em; }
.btn-generate .gen-hint { font-size: 13px; opacity: 0.75; }
.home-row { display: flex; gap: 12px; }
.btn-ghost, .btn-primary, .btn-secondary {
  min-height: 48px; padding: 0 18px; border-radius: 999px; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-ghost, .btn-secondary { border: 1px solid var(--line); background: var(--card); }
.btn-primary { background: linear-gradient(180deg, #f3dc9a, #d9b35f); color: #0c2319; font-weight: 600; }
.btn-primary:disabled { background: rgba(233, 201, 119, 0.22); color: var(--ink-2); }
.count {
  min-width: 26px; height: 22px; padding: 0 7px; border-radius: 11px; font-size: 13px;
  background: rgba(233, 201, 119, 0.16); color: var(--gold); display: inline-grid; place-items: center;
}
.kicker { margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }

/* ---------- Lab (generation and hybridization progress) ---------- */
.overlay.lab { background: radial-gradient(circle at 50% 40%, rgba(40, 90, 64, 0.5), rgba(3, 12, 8, 0.94) 70%); }
.lab-card { width: min(88vw, 360px); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.lab-stage { position: relative; width: 100%; height: 240px; }
.lab-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.lab-parent {
  position: absolute; top: 50%; width: 96px; height: 96px; margin-top: -48px; border-radius: 16px;
  object-fit: contain; background: rgba(255, 255, 255, 0.04);
}
.lab-parent-a { left: 0; }
.lab-parent-b { right: 0; }
.lab-title { margin: 0; font-family: var(--serif); font-size: 20px; }
.progress { width: 100%; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #7fd3b5, #e9c977); transition: width 0.08s linear; }
.lab-count { margin: 0; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lab-skip { margin: 0; font-size: 12px; color: var(--ink-3); }

/* ---------- Reveal ---------- */
.overlay.reveal { align-items: stretch; justify-content: stretch; background: radial-gradient(120% 70% at 50% 0%, #1d4a36 0%, #0a1f16 55%, #04100b 100%); }
.reveal-card {
  width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column;
  padding: calc(var(--safe-t) + 12px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 14px) calc(var(--safe-l) + 16px);
}
.reveal-top { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.reveal-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.reveal-body > * { flex-shrink: 0; }
.reveal-stage {
  position: relative; width: 100%; height: min(50vh, 440px); flex: 0 0 auto; border-radius: 26px; overflow: hidden;
  background: radial-gradient(circle at 50% 45%, rgba(233, 201, 119, 0.1), rgba(233, 201, 119, 0) 62%);
}
.reveal-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.rv-name {
  margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 7vw, 34px); line-height: 1.15;
  animation: rise 0.7s ease both 0.2s;
}
.rv-lineage { margin: 0; color: var(--ink-2); font-size: 14px; }
.rv-tier-row { display: flex; align-items: center; gap: 12px; }
.tier-chip {
  display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px;
  border: 1px solid currentColor; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
}
.tier-chip.tier-common { color: var(--tier-common); }
.tier-chip.tier-uncommon { color: var(--tier-uncommon); }
.tier-chip.tier-rare { color: var(--tier-rare); }
.tier-chip.tier-epic { color: var(--tier-epic); }
.tier-chip.tier-legendary { color: var(--tier-legendary); }
.tier-chip.tier-mythic { color: var(--tier-mythic); }
.rv-score { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 14px; }
.meter { position: relative; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.meter-fill {
  height: 100%; width: 0; border-radius: 4px;
  background: linear-gradient(90deg, #a9bcae, #86e09a, #6cc9ee, #bb97ff, #ffd27a, #ff86e0);
  transition: width 1.2s ease 0.3s;
}
.rv-pctl { margin: 0; font-size: 13px; color: var(--ink-3); }
.rv-h { margin: 6px 0 0; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.traits { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.trait {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; padding: 8px 12px;
  border-radius: 12px; background: var(--card); border: 1px solid rgba(255, 255, 255, 0.05); animation: rise 0.5s ease both;
}
.trait-name { display: block; font-size: 15px; }
.trait-gene { display: block; font-size: 12px; color: var(--ink-3); }
.trait-pct { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; white-space: nowrap; }
.trait-pct.r-legendary { color: var(--tier-legendary); }
.trait-pct.r-epic { color: var(--tier-epic); }
.trait-pct.r-rare { color: var(--tier-rare); }
.trait-pct.r-uncommon { color: var(--tier-uncommon); }
.trait-pct.r-common { color: var(--tier-common); }
.reveal-actions { display: flex; gap: 12px; padding-top: 12px; flex: 0 0 auto; }
.reveal-actions button { flex: 1; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Gallery ---------- */
.gallery-tools { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
.search-input {
  flex: 1; min-width: 0; min-height: 44px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 15px;
}
.search-input::placeholder { color: var(--ink-3); }
.sort-select {
  min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--glass); color: var(--ink); font: inherit; font-size: 14px;
}
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink-2); font: inherit; font-size: 14px;
}
.chip[aria-pressed="true"] { background: rgba(233, 201, 119, 0.2); color: var(--ink); border-color: rgba(233, 201, 119, 0.5); }
.gallery-sub { margin: 4px 0 6px; font-size: 13px; color: var(--ink-3); }
.grid {
  flex: 1; min-height: 0; overflow-y: auto; align-content: start; display: grid; grid-auto-rows: max-content;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
  padding: 4px 2px calc(var(--safe-b) + 24px);
}
.grid-sentinel { grid-column: 1 / -1; height: 1px; }
.card {
  position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 18px;
  background: var(--card); border: 1px solid rgba(255, 255, 255, 0.06); cursor: pointer;
}
.card .thumb { aspect-ratio: 1; background: radial-gradient(circle at 50% 45%, rgba(233, 201, 119, 0.08), rgba(0, 0, 0, 0) 70%); }
.card .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.card-body { padding: 8px 44px 10px 10px; min-width: 0; }
.card-name {
  margin: 0; font-family: var(--serif); font-size: 15px; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.card-meta .tier-chip { min-height: 22px; padding: 0 8px; font-size: 10px; }
.badge.hybrid {
  padding: 3px 8px; border-radius: 999px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  background: linear-gradient(90deg, rgba(127, 211, 181, 0.25), rgba(233, 201, 119, 0.3)); color: var(--ink);
}
.gen { font-size: 11px; color: var(--ink-3); }
.fav, .more {
  position: absolute; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
  background: rgba(7, 24, 18, 0.72); color: var(--ink-2); font-size: 18px;
}
.fav { top: 4px; right: 4px; }
.fav.on { color: var(--gold); }
.more { right: 2px; bottom: 2px; }
.gallery-empty { margin: auto; padding: 24px; display: grid; gap: 14px; justify-items: center; text-align: center; color: var(--ink-2); }

/* Bottom sheet */
.overlay.sheet { align-items: flex-end; justify-content: stretch; }
.sheet-card {
  width: 100%; max-width: 520px; margin: 0 auto; padding: 14px 16px calc(var(--safe-b) + 16px);
  border-radius: 22px 22px 0 0; background: var(--bg1); border-top: 1px solid var(--line);
  display: grid; gap: 8px; animation: rise 0.3s ease both;
}
.sheet-title { margin: 0 0 4px; text-align: center; font-family: var(--serif); font-size: 18px; }
.sheet-action {
  min-height: 52px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
  font: inherit; font-size: 16px;
}
.sheet-action.danger { color: #ff9b9b; }
.sheet-action:disabled { opacity: 0.5; }

/* Dialogs: prompt and confirm */
.dialog-card {
  width: min(88vw, 360px); padding: 20px; border-radius: 22px; background: var(--bg1);
  border: 1px solid var(--line); display: grid; gap: 14px; animation: rise 0.3s ease both;
}
.dialog-card h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 20px; }
.dialog-card input {
  min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font: inherit; font-size: 16px;
}
.dialog-text { margin: 0; color: var(--ink-2); font-size: 14px; }
.dialog-actions { display: flex; gap: 10px; }
.dialog-actions button { flex: 1; }
.btn-danger { min-height: 48px; padding: 0 18px; border-radius: 999px; background: #c9574e; color: #fff; font-weight: 600; }

/* @@css:components */
</style>
</head>
<body>
<noscript><p class="noscript">Endless Garden needs JavaScript to grow.</p></noscript>
<div id="app">
  <section id="screen-home" class="screen active" aria-label="Home">
    <header class="topbar">
      <div class="brand-block">
        <h1 class="brand">Endless Garden</h1>
        <p class="sub">A living botanical laboratory</p>
      </div>
    </header>
    <div class="home-stage">
      <div class="specimen" id="specimen">
        <canvas id="homeCanvas" aria-hidden="true"></canvas>
        <p class="specimen-caption" id="specimenCaption">Your first specimen waits in the soil.</p>
      </div>
      <button type="button" class="btn-generate" id="btnGenerate">
        <span class="gen-label">Generate Plant</span>
        <span class="gen-hint">45 genes, endless variety</span>
      </button>
      <div class="home-row">
        <button type="button" class="btn-ghost" id="btnGallery" data-nav="gallery">Gallery <span class="count" id="galleryCount">0</span></button>
        <button type="button" class="btn-ghost" id="btnHybridize" data-nav="gallery">Hybridize</button>
      </div>
    </div>
  </section>

  <section id="screen-gallery" class="screen" aria-label="Gallery">
    <header class="topbar">
      <button class="icon-btn" type="button" data-nav="home" aria-label="Back to home">&#8249;</button>
      <div class="brand-block"><h2 class="title">Gallery</h2></div>
    </header>
    <div class="gallery-tools">
      <input type="search" id="gSearch" class="search-input" placeholder="Search names or traits" aria-label="Search specimens" autocomplete="off">
      <select id="gSort" class="sort-select" aria-label="Sort specimens">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="rarest">Rarest</option>
        <option value="common">Most common</option>
        <option value="name">Name A–Z</option>
        <option value="generation">Generation</option>
      </select>
    </div>
    <div class="chips" id="gFilters" role="group" aria-label="Filter specimens"></div>
    <p class="gallery-sub" id="gSub"></p>
    <div class="grid" id="gGrid"></div>
    <div class="gallery-empty" id="gEmpty" hidden></div>
  </section>

  <section id="screen-detail" class="screen" aria-label="Specimen details">
    <header class="topbar">
      <button class="icon-btn" type="button" data-nav="gallery" aria-label="Back to gallery">&#8249;</button>
      <div class="brand-block"><h2 class="title">Specimen</h2></div>
    </header>
    <!-- @@html:detail -->
  </section>

  <div id="overlay-lab" class="overlay lab" hidden role="status" aria-live="polite">
    <div class="lab-card">
      <div class="lab-stage">
        <img class="lab-parent lab-parent-a" id="labParentA" alt="" hidden>
        <canvas id="labCanvas" aria-hidden="true"></canvas>
        <img class="lab-parent lab-parent-b" id="labParentB" alt="" hidden>
      </div>
      <p class="kicker" id="labKicker">Germinating</p>
      <p class="lab-title" id="labTitle"></p>
      <div class="progress" aria-hidden="true"><div class="progress-fill" id="labBar"></div></div>
      <p class="lab-count" id="labCount"></p>
      <p class="lab-skip">Tap to skip</p>
    </div>
  </div>
  <div id="overlay-reveal" class="overlay reveal" hidden role="dialog" aria-modal="true" aria-label="Specimen reveal">
    <div class="reveal-card">
      <header class="reveal-top">
        <span class="kicker" id="rvKicker">New specimen</span>
        <button type="button" class="icon-btn" id="rvClose" aria-label="Close">&times;</button>
      </header>
      <div class="reveal-body">
        <div class="reveal-stage"><canvas id="rvCanvas" aria-hidden="true"></canvas></div>
        <h2 class="rv-name" id="rvName"></h2>
        <p class="rv-lineage" id="rvLineage" hidden></p>
        <div class="rv-tier-row"><span class="tier-chip" id="rvTier"></span><span class="rv-score" id="rvScore"></span></div>
        <div class="meter" aria-hidden="true"><div class="meter-fill" id="rvMeter"></div></div>
        <p class="rv-pctl" id="rvPctl"></p>
        <h3 class="rv-h">Notable traits</h3>
        <ul class="traits" id="rvTraits"></ul>
      </div>
      <footer class="reveal-actions">
        <button type="button" class="btn-secondary" id="rvAgain">Generate Another</button>
        <button type="button" class="btn-primary" id="rvSave">Save to Gallery</button>
      </footer>
    </div>
  </div>
  <div id="sheet" class="overlay sheet" hidden role="dialog" aria-modal="true" aria-label="Actions">
    <!-- @@html:sheet -->
  </div>
  <div id="dialog" class="overlay dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <!-- @@html:dialog -->
  </div>
  <div id="settings" class="overlay settings" hidden role="dialog" aria-modal="true" aria-label="Settings">
    <!-- @@html:settings -->
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script>
'use strict';
/*
 * Endless Garden: one file, labelled sections.
 * Genetics, Naming, Layout, Renderer, Loop, Store, UI.
 * window.EndlessGarden (alias EG) exposes helpers for automated checks.
 */
const EG = (window.EndlessGarden = window.EndlessGarden || {});

/* ===== Genetics ===== */
/* ---------- Gene catalogue (spec Appendix A) ---------- */
// Weights are relative percentages. GENES normalizes them per gene into probabilities p.
const GENE_GROUPS = Object.freeze([
  Object.freeze({ id: 'trunk', label: 'Trunk', count: 9 }),
  Object.freeze({ id: 'foliage', label: 'Foliage', count: 9 }),
  Object.freeze({ id: 'flower', label: 'Flowers', count: 7 }),
  Object.freeze({ id: 'fruit', label: 'Fruit and seed', count: 5 }),
  Object.freeze({ id: 'form', label: 'Form', count: 4 }),
  Object.freeze({ id: 'special', label: 'Special', count: 6 }),
  Object.freeze({ id: 'unique', label: 'Unique', count: 5 }),
]);
const GENE_COUNT = 45;

// [key, label, group id, [[allele name, weight], ...]]
const GENE_DATA = [

// Derive per-allele probability p = w / sum(w) within the gene, and bits = -log2(p).
const GENES = Object.freeze(GENE_DATA.map(([key, label, group, rows], i) => {
  const total = rows.reduce((sum, row) => sum + row[1], 0);
  const alleles = rows.map(([name, w], j) => {
    const p = w / total;
    return Object.freeze({ i: j, name, w, p, bits: -Math.log2(p) });
  });
  return Object.freeze({ i, key, label, group, alleles: Object.freeze(alleles) });
}));
if (GENES.length !== GENE_COUNT) throw new Error(`gene catalogue has ${GENES.length} genes, expected ${GENE_COUNT}`);

/* ---------- Seeded randomness and hashing ---------- */
// mulberry32: small and fast. Each call returns a number in [0, 1).
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// FNV-1a, 32-bit. Seeds the layout and the name from a genome.
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

/* ---------- Sampling, rarity, and tiers ---------- */
// Draw one allele per gene, each by its weight.
function sampleGenome(rng) {
  return GENES.map((gene) => {
    const r = rng();
    let acc = 0;
    for (const allele of gene.alleles) {
      acc += allele.p;
      if (r < acc) return allele.i;
    }
    return gene.alleles[gene.alleles.length - 1].i;
  });
}

// Tier thresholds on the 0 to 100 rarity score (spec section 5).
const TIERS = Object.freeze([
  Object.freeze({ id: 'common', label: 'Common', min: 0 }),
  Object.freeze({ id: 'uncommon', label: 'Uncommon', min: 60 }),
  Object.freeze({ id: 'rare', label: 'Rare', min: 85 }),
  Object.freeze({ id: 'epic', label: 'Epic', min: 95 }),
  Object.freeze({ id: 'legendary', label: 'Legendary', min: 99 }),
  Object.freeze({ id: 'mythic', label: 'Mythic', min: 99.7 }),
]);

// Count of sorted values <= x (binary search for the upper bound).
function countAtMost(sorted, x) {
  let lo = 0;
  let hi = sorted.length;
  while (lo < hi) {
    const mid = (lo + hi) >>> 1;
    if (sorted[mid] <= x) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

// Calibration population: 10,000 random genomes from a fixed seed, sorted once at load.
const CAL = (() => {
  const rng = rngFrom(0x5eed);
  const bits = new Float64Array(10000);
  for (let k = 0; k < bits.length; k++) {
    const genes = sampleGenome(rng);
    let total = 0;
    for (let i = 0; i < GENE_COUNT; i++) total += GENES[i].alleles[genes[i]].bits;
    bits[k] = total;
  }
  return bits.sort();
})();

// Analyze a genome: alleles, surprisal in bits, score and tier, seed, and notable traits (p < 0.12).
function analyze(genes) {
  if (!Array.isArray(genes) || genes.length !== GENE_COUNT) throw new Error(`analyze expects ${GENE_COUNT} allele indices`);
  const alleles = GENES.map((gene, i) => {
    const allele = gene.alleles[genes[i]];
    if (!allele) throw new Error(`gene ${gene.key} has no allele ${genes[i]}`);
    return allele;
  });
  const bits = alleles.reduce((sum, a) => sum + a.bits, 0);
  const score = (100 * countAtMost(CAL, bits)) / CAL.length;
  const tier = TIERS.reduce((best, t) => (score >= t.min ? t : best), TIERS[0]);
  const notable = [];
  GENES.forEach((gene, i) => {
    if (alleles[i].p < 0.12) notable.push({ gene, allele: alleles[i] });
  });
  notable.sort((x, y) => x.allele.w - y.allele.w);
  return {
    alleles,
    bits,
    score,
    tier: { id: tier.id, label: tier.label },
    seed: fnv1a(genes.join(',')),
    notable,
  };
}

EG.CAL = CAL;

/* ---------- Breeding, mutation, and forecast (spec section 6) ---------- */
// Record ids identify records only. They never affect gameplay.
function newId() {
  return `p${Date.now().toString(36)}${Math.floor(Math.random() * 1e9).toString(36)}`;
}

// Choose among alleles, favoring rare ones with weight 1 / sqrt(w).
function pickRare(candidates, rng) {
  let total = 0;
  for (const a of candidates) total += 1 / Math.sqrt(a.w);
  let r = rng() * total;
  for (const a of candidates) {
    r -= 1 / Math.sqrt(a.w);
    if (r < 0) return a;
  }
  return candidates[candidates.length - 1];
}

// Offspring genome. Per gene: parents agree (origin 2), or the child takes A with pA in [0.40, 0.60], else B.
// Then mutation: chance mu in [0.05, 0.12]; one hit (80%) or two (20%), each on one gene.
function breed(genesA, genesB, rng) {
  const genes = new Array(GENE_COUNT);
  const origin = new Array(GENE_COUNT);
  for (let i = 0; i < GENE_COUNT; i++) {
    if (genesA[i] === genesB[i]) {
      genes[i] = genesA[i];
      origin[i] = 2;
      continue;
    }
    const pA = 0.4 + 0.2 * rng();
    const fromA = rng() < pA;
    genes[i] = fromA ? genesA[i] : genesB[i];
    origin[i] = fromA ? 0 : 1;
  }
  const mutationChance = 0.05 + 0.07 * rng();
  const mutations = [];
  if (rng() < mutationChance) {
    const hits = rng() < 0.2 ? 2 : 1;
    for (let h = 0; h < hits; h++) {
      const g = Math.floor(rng() * GENE_COUNT);
      if (mutations.some((m) => m.gene === g)) continue;
      const gene = GENES[g];
      let candidates = gene.alleles.filter((a) => a.i !== genesA[g] && a.i !== genesB[g]);
      if (candidates.length === 0) candidates = gene.alleles.filter((a) => a.i !== genes[g]);
      const chosen = pickRare(candidates, rng);
      genes[g] = chosen.i;
      origin[g] = 3;
      mutations.push({ gene: g, allele: chosen.i });
    }
  }
  return { genes, origin, mutations, mutationChance };
}

// Traits a child can inherit: shared alleles are certain; otherwise about 50% per parent.
// Lists notable alleles (p < 0.12), rarest first.
function forecast(genesA, genesB) {
  const out = [];
  for (const gene of GENES) {
    const a = gene.alleles[genesA[gene.i]];
    const b = gene.alleles[genesB[gene.i]];
    if (a.i === b.i) {
      if (a.p < 0.12) out.push({ gene, allele: a, chance: 1, src: 'shared' });
    } else {
      if (a.p < 0.12) out.push({ gene, allele: a, chance: 0.5, src: 'A' });
      if (b.p < 0.12) out.push({ gene, allele: b, chance: 0.5, src: 'B' });
    }
  }
  return out.sort((x, y) => x.allele.w - y.allele.w);
}

// Parent snapshot kept on a hybrid, so lineage survives deleting the parent.
function snapshot(record) {
  return {
    id: record.id,
    name: record.name,
    genus: { pre: record.genus.pre, suf: record.genus.suf },
    gen: record.gen || 0,
    genes: record.genes.slice(),
  };
}

// Hybrid record (not yet stored): breeds the genomes, names the child, and records lineage.
function makeHybrid(recordA, recordB, rng) {
  const child = breed(recordA.genes, recordB.genes, rng);
  const analysis = analyze(child.genes);
  const { name, genus } = hybridName(recordA, recordB, analysis, rng);
  return {
    id: newId(),
    name,
    genus,
    genes: child.genes,
    createdAt: Date.now(),
    fav: false,
    gen: Math.max(recordA.gen || 0, recordB.gen || 0) + 1,
    parents: [snapshot(recordA), snapshot(recordB)],
    origin: child.origin,
    mutations: child.mutations,
    mutationChance: child.mutationChance,
  };
}

EG.newId = newId;
EG.breed = breed;
EG.forecast = forecast;
EG.makeHybrid = makeHybrid;

/* ---------- Procedural names (spec section 7) ---------- */
// Genus = prefix + suffix. Pure plants may take an adjective epithet, placed before the genus.
// Legendary and Mythic always take a legend phrase, placed after the genus.
const PREFIXES = Object.freeze(['Lumi', 'Shade', 'Ember', 'Moon', 'Silk', 'Thorn', 'Aster', 'Velvet', 'Nyx', 'Cinder', 'Frost', 'Ivy', 'Sable', 'Gilt', 'Mire', 'Opal', 'Briar', 'Halo', 'Dusk', 'Pearl', 'Wisp', 'Ash', 'Rune', 'Fern', 'Lark', 'Myrrh', 'Sol', 'Tide', 'Vale', 'Corin', 'Amara', 'Ilex', 'Selene', 'Vesper', 'Lysa', 'Maren', 'Oriel', 'Quill', 'Ravel', 'Sylva']);
const SUFFIXES = Object.freeze(['nara', 'veil', 'root', 'thorn', 'bloom', 'wisp', 'glade', 'dew', 'crest', 'spire', 'lune', 'mere', 'frond', 'bark', 'ling', 'ora', 'ia', 'ell', 'orn', 'wyn', 'loom', 'gleam', 'mantle', 'hollow', 'bell', 'tide', 'fall', 'whisper', 'ana', 'ine', 'ara']);
const EPITHETS = Object.freeze(['Gentle', 'Quiet', 'Silver', 'Wild', 'Hollow', 'Amber', 'Pale', 'Gilded', 'Hushed', 'Sunward', 'Starlit', 'Tidal', 'Mistbound', 'Verdant', 'Nightbloom', 'Ashen', 'Pearled', 'Lantern', 'Dawnlit', 'Moonlit', 'Rimed', 'Glasswing', 'Umbral', 'Candled', 'Emberlit']);
const LEGEND_EPITHETS = Object.freeze(['of the Hollow Sun', 'the Everbloom', 'of Forgotten Dawns', 'the Starbearer', 'of the Deep Glade', 'Eternal', 'of the Vesper Gate', 'the Unfading']);

function pick(rng, list) {
  return list[Math.floor(rng() * list.length)];
}

function genusText(genus) {
  return genus.pre + genus.suf;
}

// Epithet rules: Legendary and Mythic always take a legend phrase; other tiers take an adjective 45% of the time.
function applyEpithet(base, tierId, rng) {
  if (tierId === 'legendary' || tierId === 'mythic') return `${base} ${pick(rng, LEGEND_EPITHETS)}`;
  if (rng() < 0.45) return `${pick(rng, EPITHETS)} ${base}`;
  return base;
}

// Pure plant name. A pure function of the genome seed, so one genome always gets one name.
function pureName(analysis) {
  const rng = rngFrom(fnv1a(`name:${analysis.seed}`));
  const genus = { pre: pick(rng, PREFIXES), suf: pick(rng, SUFFIXES) };
  return { name: applyEpithet(genusText(genus), analysis.tier.id, rng), genus };
}

// Hybrid name. Half the time "A × B" from the parents' genera; otherwise a blended genus.
// The hybrid genus is always the parents' blend (A's prefix + B's suffix), so later crosses keep it.
function hybridName(recordA, recordB, analysis, rng) {
  const genus = { pre: recordA.genus.pre, suf: recordB.genus.suf };
  if (rng() < 0.5) {
    const pair = `${genusText(recordA.genus)} × ${genusText(recordB.genus)}`;
    const legendary = analysis.tier.id === 'legendary' || analysis.tier.id === 'mythic';
    return { name: legendary ? `${pair} ${pick(rng, LEGEND_EPITHETS)}` : pair, genus };
  }
  return { name: applyEpithet(genusText(genus), analysis.tier.id, rng), genus };
}

EG.PREFIXES = PREFIXES;
EG.SUFFIXES = SUFFIXES;
EG.EPITHETS = EPITHETS;
EG.LEGEND_EPITHETS = LEGEND_EPITHETS;
EG.pureName = pureName;
EG.hybridName = hybridName;

    petals: T.petalCount.v,
    rainbow: fc === 'rainbow',
    flowerColor: fc === 'rainbow' ? null : [hexToRgb(fc[0]), hexToRgb(fc[1])],
    flowerSize: T.flowerSize.v,
    glow: T.bioluminescentFlowers.v === 1,
    fruit: T.fruitType.v,
    fruitColor: hexToRgb(T.fruitColor.v),
    fruitSize: T.fruitSize.v,
    fruitArrangement: T.fruitArrangement.v,
  };
}

// Leaves of one cluster: position, angle, length, tone, back or front layer, and season tint.
function leafSpecs(c, env, rng) {
  const n = c.leaves;
  const r = c.radius;
  const out = [];
  for (let k = 0; k < n; k++) {
    let th;
    let d;
    let ang;
    switch (env.arrangement) {
      case 'alt':
        th = -1.2 + 2.4 * (n > 1 ? k / (n - 1) : 0.5) + (rng() - 0.5) * 0.3;
        d = r * (0.2 + 0.25 * rng());
        ang = th + (rng() - 0.5) * 0.4;
        break;
      case 'opp': {
        const side = k % 2 ? 1 : -1;
        th = side * (0.8 + 0.2 * rng()) + (Math.floor(k / 2) / Math.max(1, n / 2) - 0.5) * 1.1;
        d = r * (0.15 + 0.2 * rng());
        ang = th + (rng() - 0.5) * 0.4;
        break;
      }
      case 'whorl':
        th = (TAU * k) / n + (rng() - 0.5) * 0.2;
        d = r * 0.2;
        ang = th;
        break;
      case 'rosette':
        th = (TAU * k) / n;
        d = r * (0.12 + 0.08 * rng());
        ang = th;
        break;
      case 'spiral':
        th = k * 2.39996;
        d = r * 0.75 * Math.sqrt((k + 1) / n);
        ang = th;
        break;
      default:
        th = (rng() - 0.5) * 0.8;
        d = r * 0.25 * rng();
        ang = th + (rng() - 0.5) * 0.35;
    }
    const season = SEASON[env.season] && rng() < SEASON[env.season].chance ? env.season : null;
    out.push({
      x: Math.cos(th) * d,
      y: Math.sin(th) * d,
      ang,
      len: env.leafLength * env.lengthScale * (0.75 + 0.5 * rng()),
      tone: 0.25 + 0.7 * rng(),
      back: rng() < 0.3,
      season,
    });
  }
  return out;
}

// Fill for one leaf, in the leaf's own unit space. The gradient mode comes from the leaf gradient gene.
function leafFill(x, base, env) {
  const light = mixRgb(base, env.light, 0.35);
  const dark = mixRgb(base, env.dark, 0.5);
  switch (env.gradient) {
    case 'two': {
      const g = x.createLinearGradient(0, -0.5, 0, 0.5);
      g.addColorStop(0, rgbStr(light));
      g.addColorStop(1, rgbStr(dark));
      return g;
    }
    case 'radial': {
      const g = x.createRadialGradient(0.3, 0, 0.02, 0.3, 0, 0.9);
      g.addColorStop(0, rgbStr(light));
      g.addColorStop(1, rgbStr(dark));
      return g;
    }
    case 'irid': {
      const g = x.createLinearGradient(0, 0, 1, 0);
      g.addColorStop(0, rgbStr(base));
      g.addColorStop(0.5, rgbStr(mixRgb(base, [127, 208, 255], 0.35)));
      g.addColorStop(1, rgbStr(dark));
      return g;
    }
    case 'aurora': {
      const g = x.createLinearGradient(0, 0, 1, 0);
      g.addColorStop(0, rgbStr(mixRgb(base, [79, 209, 197], 0.45)));
      g.addColorStop(0.5, rgbStr(mixRgb(base, [139, 111, 224], 0.45)));
      g.addColorStop(1, rgbStr(mixRgb(base, [242, 200, 107], 0.4)));
      return g;
    }
    default:
      return rgbStr(base);
  }
}

function drawLeaf(x, s, env) {
  const pts = leafOutline(env.shape, env.edge);
  let base = mixRgb(env.dark, env.light, s.tone);
  if (s.season) base = mixRgb(base, SEASON[s.season].mix, SEASON[s.season].amount);
  x.save();
  x.translate(s.x, s.y);
  x.rotate(s.ang);
  x.scale(s.len, s.len);
  x.beginPath();
  x.moveTo(pts[0], pts[1]);
  for (let p = 2; p < pts.length; p += 2) x.lineTo(pts[p], pts[p + 1]);
  x.closePath();
  x.fillStyle = leafFill(x, base, env);
  x.fill();
  x.strokeStyle = s.back ? 'rgba(0,0,0,0.16)' : 'rgba(255,255,255,0.16)';
  x.lineWidth = 0.025;
  x.beginPath();
  x.moveTo(0.03, 0);
  x.lineTo(0.9, 0);
  x.stroke();
  x.restore();
}

function drawFlower(x, cx, cy, size, env, rng) {
  const spec = BLOOM[env.bloomName] || BLOOM.cup;
  const count = env.bloomName === 'spray' ? 3 : 1;
  const n = Math.min(24, Math.max(3, env.petals));
  for (let m = 0; m < count; m++) {
    const mx = count > 1 ? cx + (rng() - 0.5) * size * 2.4 : cx;
    const my = count > 1 ? cy + (rng() - 0.5) * size * 2.4 : cy;
    const s = count > 1 ? size * 0.55 : size;
    if (env.glow) {
      const g = x.createRadialGradient(mx, my, 0, mx, my, s * 3);
      g.addColorStop(0, 'rgba(190,255,220,0.35)');
      g.addColorStop(1, 'rgba(190,255,220,0)');
      x.fillStyle = g;
      x.beginPath();
      x.arc(mx, my, s * 3, 0, TAU);
      x.fill();
    }
    for (let p = 0; p < n; p++) {
      const a = (TAU * p) / n + spec.spin * p * 0.12;
      const col = env.rainbow ? `hsl(${(360 * p) / n},80%,72%)` : rgbStr(mixRgb(env.flowerColor[0], env.flowerColor[1], (p % 3) / 2));
      x.save();
      x.translate(mx + Math.cos(a) * s * spec.off, my + Math.sin(a) * s * spec.off);
      x.rotate(a);
      x.fillStyle = col;
      x.beginPath();
      x.ellipse(0, 0, s * spec.l, s * spec.w, 0, 0, TAU);
      x.fill();
      x.restore();
    }
    x.fillStyle = '#f2c94c';
    x.beginPath();
    x.arc(mx, my, s * 0.16, 0, TAU);
    x.fill();
  }
}

// Fruit position within a cluster of radius r, by arrangement.
function fruitPos(arrangement, k, n, r, rng) {
  switch (arrangement) {
    case 'crown': {
      const a = (TAU * k) / n;
      return [Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6];
    }
    case 'garland': {
      const a = Math.PI * 0.15 + Math.PI * 0.7 * (n > 1 ? k / (n - 1) : 0.5);
      return [Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6 + r * 0.1];
    }
    case 'hang':
      return [(k - (n - 1) / 2) * r * 0.22, r * (0.22 + 0.25 * rng())];
    case 'spiral': {
      const a = k * 2.39996;
      const d = r * 0.6 * Math.sqrt((k + 1) / n);
      return [Math.cos(a) * d, Math.sin(a) * d];
    }
    case 'const':
      return [(rng() - 0.5) * r * 1.4, (rng() - 0.5) * r * 1.4];
    default:
      return [(rng() - 0.5) * r * 1.1, (rng() - 0.5) * r * 1.1];
  }
}

function drawStar(x, cx, cy, r, points) {
  for (let p = 0; p < points * 2; p++) {
    const rad = p % 2 ? r * 0.45 : r;
    const a = (Math.PI * p) / points - Math.PI / 2;
    const px = cx + Math.cos(a) * rad;
    const py = cy + Math.sin(a) * rad;
    if (p === 0) x.moveTo(px, py);
    else x.lineTo(px, py);
  }
  x.closePath();
}

function drawFruit(x, env, px, py, s, rng) {
  if (env.fruitArrangement === 'hang') {
    x.strokeStyle = 'rgba(70,50,30,0.6)';
    x.lineWidth = s * 0.25;
    x.beginPath();
    x.moveTo(px, 0);
    x.lineTo(px, py);
    x.stroke();
  }
  if (env.fruit === 'orb') {
    const g = x.createRadialGradient(px, py, 0, px, py, s * 2.6);
    g.addColorStop(0, rgbStr(env.fruitColor, 0.45));
    g.addColorStop(1, rgbStr(env.fruitColor, 0));
    x.fillStyle = g;
    x.beginPath();
    x.arc(px, py, s * 2.6, 0, TAU);
    x.fill();
  }
  x.fillStyle = rgbStr(env.fruitColor);
  x.beginPath();
  if (env.fruit === 'pod') {
    x.ellipse(px, py, s * 1.6, s * 0.6, rng() * Math.PI, 0, TAU);
  } else if (env.fruit === 'drupe') {
    for (let d = -1; d <= 1; d++) {
      const cy = py + (d === 0 ? -s * 0.5 : s * 0.2);
      x.moveTo(px + d * s * 0.9 + s * 0.55, cy);
      x.arc(px + d * s * 0.9, cy, s * 0.55, 0, TAU);
    }
  } else if (env.fruit === 'star') {
    drawStar(x, px, py, s * 1.1, 5);
  } else if (env.fruit === 'lantern') {
    x.ellipse(px, py, s * 0.8, s * 1.1, 0, 0, TAU);
  } else {
    x.arc(px, py, s, 0, TAU);
  }
  x.fill();
  x.fillStyle = 'rgba(255,255,255,0.45)';
  x.beginPath();
  x.arc(px - s * 0.3, py - s * 0.3, s * 0.25, 0, TAU);
  x.fill();
}

// Crystal facets for clusters with the crystalline gene.
function drawCrystals(x, r, rng) {
  for (let k = 0; k < 3; k++) {
    const a = rng() * TAU;
    const d = r * (0.6 + 0.3 * rng());
    const s = r * 0.14;
    const cx = Math.cos(a) * d;
    const cy = Math.sin(a) * d;
    x.beginPath();
    x.moveTo(cx, cy - s);
    x.lineTo(cx + s * 0.6, cy);
    x.lineTo(cx, cy + s);
    x.lineTo(cx - s * 0.6, cy);
    x.closePath();
    x.fillStyle = 'rgba(206,246,255,0.8)';
    x.fill();
    x.strokeStyle = 'rgba(255,255,255,0.9)';
    x.lineWidth = s * 0.12;
    x.stroke();
  }
}

// One cluster sprite: leaves, flowers, fruit, and crystal facets, drawn in cluster units at res px per unit.
function buildClusterSprite(c, env, res) {
  const size = Math.max(8, Math.ceil(2 * c.radius * res * 1.15));
  const cv = document.createElement('canvas');
  cv.width = size;
  cv.height = size;
  const x = cv.getContext('2d');
  x.setTransform(res, 0, 0, res, size / 2, size / 2);
  const rng = rngFrom(c.seed);
  for (const s of leafSpecs(c, env, rng)) drawLeaf(x, s, env);
  const blossoms = env.blossom && rng() < 0.6 ? 1 : 0;
  for (let f = 0; f < c.flowers + blossoms; f++) {
    const fx = (rng() - 0.5) * c.radius * 0.9;
    const fy = (rng() - 0.5) * c.radius * 0.9;
    drawFlower(x, fx, fy, c.radius * 0.17 * env.flowerSize * (0.8 + 0.4 * rng()), env, rng);
  }
  for (let f = 0; f < c.fruit; f++) {
    const [fx, fy] = fruitPos(env.fruitArrangement, f, c.fruit, c.radius, rng);
    drawFruit(x, env, fx, fy, c.radius * 0.1 * env.fruitSize * (0.85 + 0.3 * rng()), rng);
  }
  if (c.crystal) drawCrystals(x, c.radius, rng);
  return { cv, res, half: size / 2 };
}

// Sprites for every cluster of a layout, in cluster order. Thumbnails skip every other cluster.
function buildSprites(layout, traits, res, thumb = false) {
  const env = renderEnv(traits);
  return layout.clusters.map((c, k) => (thumb && k % 2 ? null : buildClusterSprite(c, env, res)));
}

// Runtime cache: layout, traits, and sprites per plant. Holds the 8 most recently used plants.
const RUNTIME = new Map();

// Transient runtimes (thumbnails) are built without entering the cache.
function runtimeFor(record, transient = false) {
  const cached = transient ? undefined : RUNTIME.get(record.id);
  if (cached) {
    RUNTIME.delete(record.id);
    RUNTIME.set(record.id, cached);
    return cached;
  }
  const analysis = analyze(record.genes);
  const traits = traitsOf(record.genes);
  const layout = buildLayout(record.genes, analysis.seed);
  const order = layout.clusters.map((_, k) => k)
    .sort((a, b) => layout.nodes[layout.clusters[a].node].depth - layout.nodes[layout.clusters[b].node].depth);
  const phases = Float64Array.from(layout.clusters, (c) => ((c.seed % 1000) / 1000) * TAU);
  const rt = { id: record.id, analysis, traits, layout, order, phases, sprites: new Map() };
  if (!transient) {
    RUNTIME.set(record.id, rt);
    if (RUNTIME.size > 8) RUNTIME.delete(RUNTIME.keys().next().value);
  }
  return rt;
}

// Sprites for one resolution bucket, cached per plant. Keeps the 3 most recent buckets.
function spritesFor(rt, res, thumb = false) {
  const key = thumb ? `t${res}` : res;
  let entry = rt.sprites.get(key);
  if (!entry) {
    entry = { res, list: buildSprites(rt.layout, rt.traits, res, thumb) };
    rt.sprites.set(key, entry);
    if (rt.sprites.size > 3) rt.sprites.delete(rt.sprites.keys().next().value);
  }
  return entry;
}

// Bark glyphs, placed along a trunk or branch. (ux, uy) is along the node, (nx, ny) is its normal.
function drawMark(x, kind, px, py, ux, uy, nx, ny, s) {
  switch (kind) {
    case 'furrow':
      x.strokeStyle = 'rgba(28,17,9,0.38)';
      x.lineWidth = s * 0.35;
      x.beginPath();
      x.moveTo(px - ux * s * 3, py - uy * s * 3);
      x.lineTo(px + ux * s * 3, py + uy * s * 3);
      x.stroke();
      break;
    case 'stripe':
      x.strokeStyle = 'rgba(30,20,10,0.3)';
      x.lineWidth = s * 0.8;
      x.beginPath();
      x.moveTo(px - ux * s * 6, py - uy * s * 6);
      x.lineTo(px + ux * s * 6, py + uy * s * 6);
      x.stroke();
      break;
    case 'paper':
      x.strokeStyle = 'rgba(255,248,230,0.4)';
      x.lineWidth = s * 0.5;
      x.beginPath();
      x.moveTo(px - nx * s * 2, py - ny * s * 2);
      x.lineTo(px + nx * s * 2, py + ny * s * 2);
      x.stroke();
      break;
    case 'scale':
      x.strokeStyle = 'rgba(255,238,210,0.22)';
      x.lineWidth = s * 0.4;
      x.beginPath();
      x.arc(px, py, s * 1.2, 0.2, Math.PI - 0.2);
      x.stroke();
      break;
    case 'gnarl':
      x.strokeStyle = 'rgba(24,14,8,0.35)';
      x.lineWidth = s * 0.45;
      x.beginPath();
      x.arc(px, py, s * 1.1, 0, Math.PI * 1.5);
      x.stroke();
      break;
    case 'spot':
      x.fillStyle = 'rgba(40,24,14,0.36)';
      x.beginPath();
      x.ellipse(px, py, s * 1.3, s * 0.9, Math.atan2(uy, ux), 0, TAU);
      x.fill();
      break;
    case 'rune':
      x.strokeStyle = 'rgba(255,214,140,0.42)';
      x.lineWidth = s * 0.45;
      x.beginPath();
      x.moveTo(px - ux * s - nx * s, py - uy * s - ny * s);
      x.lineTo(px, py);
      x.lineTo(px - ux * s + nx * s, py - uy * s + ny * s);
      x.stroke();
      break;
    case 'eye':
      x.strokeStyle = 'rgba(28,18,10,0.5)';
      x.lineWidth = s * 0.45;
      x.beginPath();
      x.arc(px, py, s * 1.6, 0, TAU);
      x.stroke();
      x.fillStyle = 'rgba(20,12,6,0.55)';
      x.beginPath();
      x.arc(px, py, s * 0.6, 0, TAU);
      x.fill();
      break;
    case 'marble':
      x.strokeStyle = 'rgba(240,230,210,0.25)';
      x.lineWidth = s * 0.4;
      x.beginPath();
      x.moveTo(px - ux * s * 3, py - uy * s * 3);
      x.quadraticCurveTo(px + nx * s * 1.5, py + ny * s * 1.5, px + ux * s * 3, py + uy * s * 3);
      x.stroke();
      break;
    case 'vein':
      x.save();
      x.globalCompositeOperation = 'lighter';
      x.strokeStyle = 'rgba(140,255,225,0.4)';
      x.lineWidth = s * 0.5;
      x.beginPath();
      x.moveTo(px - ux * s * 4, py - uy * s * 4);
      x.lineTo(px + ux * s * 4, py + uy * s * 4);
      x.stroke();
      x.restore();
      break;
    case 'moss':
      x.fillStyle = 'rgba(98,156,72,0.55)';
      x.beginPath();
      x.arc(px, py, s * 0.9, 0, TAU);
      x.fill();
      break;
    case 'lichen':
      x.fillStyle = 'rgba(196,216,160,0.5)';
      x.beginPath();
      x.arc(px, py, s * 1.5, 0, TAU);
      x.fill();
      break;
    case 'velvetmoss':
      x.fillStyle = 'rgba(72,134,64,0.42)';
      x.beginPath();
      x.arc(px, py, s * 2, 0, TAU);
      x.fill();
      break;
    case 'glowmoss':
      x.save();
      x.globalCompositeOperation = 'lighter';
      x.fillStyle = 'rgba(150,255,200,0.55)';
      x.beginPath();
      x.arc(px, py, s * 1.3, 0, TAU);
      x.fill();
      x.restore();
      break;
    default:
      break;
  }
}

const prefersReducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// A canvas that shows one plant. Owns its fit, sprites, and particles. Animates only while started.
class PlantView {
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.opts = Object.assign({ hybridColors: null }, opts);
    this.motion = prefersReducedMotion() ? 0.4 : 1;
    this.dpr = this.pixelRatio();
    this.record = null;
    this.rt = null;
    this.buf = null;
    this.grow = 1;
    this.growDuration = 1.8;
    this.particles = [];
    this.W = opts.width || 300;
    this.H = opts.height || 300;
    this.U = 100;
    this.bx = 0;
    this.by = 0;
    this.resize();
  }

  // Device-pixel ratio. Thumbnails pass dpr: 1. Other views use the window's ratio, capped at 2.
  pixelRatio() {
    return this.opts.dpr || Math.min(2, window.devicePixelRatio || 1);
  }

  // Match the canvas to its CSS box and refit the plant.
  resize() {
    const rect = this.canvas.getBoundingClientRect();
    this.W = Math.max(1, Math.round(rect.width || this.W));
    this.H = Math.max(1, Math.round(rect.height || this.H));
    this.dpr = this.pixelRatio();
    this.canvas.width = Math.round(this.W * this.dpr);
    this.canvas.height = Math.round(this.H * this.dpr);
    this.computeFit();
  }

  // U = min(W * 0.46 / halfWidth, H * 0.82 / height) in CSS px. The base sits at y = H * 0.92.
  computeFit() {
    if (!this.rt) return;
    const b = this.rt.layout.bounds;
    const halfW = Math.max(0.3, Math.abs(b.minX), Math.abs(b.maxX));
    const height = Math.max(0.5, -b.top + this.rt.layout.hover);
    this.U = Math.min((this.W * 0.46) / halfW, (this.H * 0.82) / height);
    this.bx = this.W / 2 - ((b.minX + b.maxX) / 2) * this.U;
    this.by = this.H * 0.92;
  }

  ensureSprites() {
    if (!this.rt) return null;
    const want = Math.max(24, this.U * this.dpr * SPRITE_SCALE);
    return spritesFor(this.rt, Math.round(want / 8) * 8, !!this.opts.thumb);
  }

  setPlant(record, opts = {}) {
    this.record = record;
    this.opts = Object.assign(this.opts, opts);
    this.rt = runtimeFor(record, !!this.opts.thumb);
    this.grow = opts.animate === false ? 1 : 0;
    this.growDuration = opts.growDuration || 1.8;
    this.particles.length = 0;
    this.computeFit();
    this.ensureSprites();
  }

  buffers(n) {
    if (!this.buf || this.buf.n !== n) {
      this.buf = {
        n,
        SX: new Float64Array(n),
        SY: new Float64Array(n),
        EX: new Float64Array(n),
        EY: new Float64Array(n),
        WA: new Float64Array(n),
        GP: new Float64Array(n),
      };
    }
    return this.buf;
  }

  // Draw one frame at time t (seconds) with growth g in [0, 1]. Leaves the context at identity.
  drawFrame(t, g) {
    const ctx = this.ctx;
    if (!ctx || !this.rt) return;
    const L = this.rt.layout;
    const N = L.nodes.length;
    const dt = this.lastT === undefined ? 0 : Math.min(0.1, Math.max(0, t - this.lastT));
    this.lastT = t;
    const { SX, SY, EX, EY, WA, GP } = this.buffers(N);
    const U = this.U * this.dpr;
    const baseX = this.bx * this.dpr;
    const baseY = (this.by - L.hover * this.U) * this.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.drawBackdrop(ctx, t, baseX, baseY, U);

    // Node pose: each node starts at its parent's current end, so sway accumulates up the tree.
    for (let i = 0; i < N; i++) {
      const nd = L.nodes[i];
      const px = nd.parent < 0 ? nd.x : EX[nd.parent];
      const py = nd.parent < 0 ? nd.y : EY[nd.parent];
      const gp = growthOf(nd.birth, g);
      const a = nd.angle + this.motion * nd.sway * Math.sin(t * nd.freq + nd.phase);
      const len = nd.length * gp;
      SX[i] = px;
      SY[i] = py;
      WA[i] = a;
      GP[i] = gp;
      EX[i] = px + Math.cos(a) * len;
      EY[i] = py + Math.sin(a) * len;
    }

    ctx.globalAlpha = this.rt.traits.ethereal.v;

    // Branches: tapered quads, with a highlight stroke on the thicker wood.
    for (let i = 0; i < N; i++) {
      if (GP[i] < 0.01) continue;
      const nd = L.nodes[i];
      const x0 = baseX + SX[i] * U;
      const y0 = baseY + SY[i] * U;
      const x1 = baseX + EX[i] * U;
      const y1 = baseY + EY[i] * U;
      const len = Math.hypot(x1 - x0, y1 - y0) || 1;
      const nx = -(y1 - y0) / len;
      const ny = (x1 - x0) / len;
      const h0 = Math.max(0.6, nd.w0 * U * 0.5);
      const h1 = Math.max(0.4, nd.w1 * U * 0.5);
      ctx.fillStyle = nd.color;
      ctx.beginPath();
      ctx.moveTo(x0 + nx * h0, y0 + ny * h0);
      ctx.lineTo(x1 + nx * h1, y1 + ny * h1);
      ctx.lineTo(x1 - nx * h1, y1 - ny * h1);
      ctx.lineTo(x0 - nx * h0, y0 - ny * h0);
      ctx.closePath();
      ctx.fill();
      if (h0 > 1.2) {
        ctx.strokeStyle = 'rgba(255,238,205,0.14)';
        ctx.lineWidth = h0 * 0.5;
        ctx.beginPath();
        ctx.moveTo(x0 + nx * h0 * 0.4, y0 + ny * h0 * 0.4);
        ctx.lineTo(x1 + nx * h1 * 0.4, y1 + ny * h1 * 0.4);
        ctx.stroke();
      }
    }

    // Bark marks sit on their node, offset along its normal in proportion to its width.
    for (const m of L.marks) {
      const i = m.n;
      if (GP[i] < 0.5) continue;
      const nd = L.nodes[i];
      const x0 = baseX + SX[i] * U;
      const y0 = baseY + SY[i] * U;
      const x1 = baseX + EX[i] * U;
      const y1 = baseY + EY[i] * U;
      const len = Math.hypot(x1 - x0, y1 - y0) || 1;
      const ux = (x1 - x0) / len;
      const uy = (y1 - y0) / len;
      const nx = -uy;
      const ny = ux;
      const hw = (nd.w0 + (nd.w1 - nd.w0) * m.t) * U * 0.5;
      const cx = x0 + (x1 - x0) * m.t + nx * m.o * hw;

      drawMark(ctx, m.kind, cx, cy, ux, uy, nx, ny, m.size * U * 0.012);
    }

    drawStructures(ctx, L, { SX, SY, EX, EY, GP }, this.rt.traits, U, baseX, baseY, t, this.motion);

    // Cluster sprites: one drawImage each, with rustle and growth scale in the transform.
    const sprites = this.ensureSprites();
    if (sprites) {
      const scale = U / sprites.res;
      for (const k of this.rt.order) {
        const c = L.clusters[k];
        const spr = sprites.list[k];
        if (!spr) continue;
        const cg = easeOutBack(clamp01((g - c.birth) / 0.22));
        if (cg < 0.01) continue;
        const i = c.node;
        const a = WA[i];
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        const ax = SX[i] + (EX[i] - SX[i]) * c.along;
        const ay = SY[i] + (EY[i] - SY[i]) * c.along;
        const px = ax + ca * c.offX - sa * c.offY;
        const py = ay + sa * c.offX + ca * c.offY;
        const ph = this.rt.phases[k];
        const rot = a + c.angle + this.motion * (0.08 * Math.sin(t * 1.6 + ph) + 0.03 * Math.sin(t * 3.7 + ph * 1.7));
        const f = scale * cg;
        const cs = Math.cos(rot) * f;
        const sn = Math.sin(rot) * f;
        ctx.setTransform(cs, sn, -sn, cs, baseX + px * U, baseY + py * U);
        ctx.drawImage(spr.cv, -spr.half, -spr.half);
      }
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    this.drawGlints(ctx, { SX, SY, EX, EY, WA, GP }, g, t, U, baseX, baseY);
    this.stepParticles(dt, L);
    this.drawParticles(ctx, t, U, baseX, baseY);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  // Behind the plant: glow aura, hybrid aura, and a ground shadow with hovering roots for floating plants.
  drawBackdrop(ctx, t, baseX, baseY, U) {
    const traits = this.rt.traits;
    const cx = baseX;
    const cy = baseY - 0.5 * U;
    if (traits.glowAura.v) drawAura(ctx, traits.glowAura.v, cx, cy, U, t);
    if (this.opts.hybridColors) drawHybridAura(ctx, this.opts.hybridColors, cx, cy, U, t);

    if (hover > 0) {
      const ground = this.by * this.dpr;
      ctx.fillStyle = `rgba(0,0,0,${Math.max(0.08, 0.3 - hover * 1.2)})`;
      ctx.beginPath();
      ctx.ellipse(baseX, ground, U * (0.22 - hover * 0.3), U * 0.04, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(96,70,44,0.55)';
      ctx.lineWidth = Math.max(1, U * 0.004);

  // Particle pool. Spawns from the particle gene, capped at 60 (30 under reduced motion). Thumbnails have none.
  stepParticles(dt, L) {
    for (let k = this.particles.length - 1; k >= 0; k--) {
      const p = this.particles[k];
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.vr !== undefined) p.rot += p.vr * dt;
      if (p.age >= p.life) this.particles.splice(k, 1);
    }
    const kind = this.rt.traits.particleEffect.v;
    if (!kind || this.opts.thumb || this.opts.particles === false) return;
    const cap = this.motion < 1 ? 30 : 60;
    const rate = { pollen: 5, petals: 3, spores: 3, fire: 2, stars: 2 }[kind] || 0;
    this.spawnAcc = (this.spawnAcc || 0) + rate * dt * this.motion;
    while (this.spawnAcc >= 1 && this.particles.length < cap) {
      this.spawnAcc -= 1;
      this.particles.push(spawnParticle(kind, L));
    }
    if (this.particles.length >= cap) this.spawnAcc = Math.min(this.spawnAcc, 1);
  }

  drawParticles(ctx, t, U, baseX, baseY) {
    if (this.rt.traits.particleEffect.v === 'rays' && !this.opts.thumb) drawRays(ctx, U, baseX, baseY, t);
    if (!this.particles.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.particles) {
      const life = clamp01(1 - p.age / p.life) * clamp01(p.age / 0.6);
      const px = baseX + p.x * U;
      const py = baseY + p.y * U;
      ctx.globalAlpha = life;
      if (p.kind === 'pollen') {
        ctx.fillStyle = '#ffe27a';
        ctx.beginPath();
        ctx.arc(px, py, Math.max(1, U * 0.006), 0, TAU);
        ctx.fill();
      } else if (p.kind === 'petal') {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(p.rot);
        ctx.fillStyle = '#f6b8cc';
        ctx.beginPath();
        ctx.ellipse(0, 0, U * 0.012, U * 0.006, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      } else if (p.kind === 'spore') {
        ctx.fillStyle = '#96ffbe';
        ctx.beginPath();
        ctx.arc(px, py, Math.max(1.5, U * 0.008), 0, TAU);
        ctx.fill();
      } else if (p.kind === 'fire') {
        ctx.globalAlpha = life * (0.5 + 0.5 * Math.sin(t * 6 + p.ph));
        ctx.fillStyle = '#e6ff8c';
        ctx.beginPath();
        ctx.arc(px, py, Math.max(1.2, U * 0.007), 0, TAU);
        ctx.fill();
      } else {
        // Starlight motes and burst motes: a four-point glint.
        const s = Math.max(2, U * 0.015) * (0.6 + 0.4 * Math.sin(t * 5 + (p.ph || 0)));
        ctx.strokeStyle = p.color || '#fff6d6';
        ctx.lineWidth = Math.max(1, U * 0.003);
        ctx.beginPath();
        ctx.moveTo(px - s, py);
        ctx.lineTo(px + s, py);
        ctx.moveTo(px, py - s);
        ctx.lineTo(px, py + s);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Glints on crystal clusters, twinkling at their own phase.
  drawGlints(ctx, geo, g, t, U, baseX, baseY) {
    if (this.rt.traits.crystalline.v === 0) return;
    const L = this.rt.layout;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#e6fcff';
    for (let k = 0; k < L.clusters.length; k++) {
      const c = L.clusters[k];
      if (!c.crystal || g < c.birth + 0.2) continue;
      const i = c.node;
      const a = geo.WA[i];
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const px = geo.SX[i] + (geo.EX[i] - geo.SX[i]) * c.along + ca * c.offX - sa * c.offY;
      const py = geo.SY[i] + (geo.EY[i] - geo.SY[i]) * c.along + sa * c.offX + ca * c.offY;
      const alpha = Math.max(0, Math.sin(t * 3.2 + this.rt.phases[k]));
      if (alpha < 0.05) continue;
      const s = U * 0.018 * (0.6 + 0.4 * alpha);
      const x = baseX + px * U;
      const y = baseY + py * U;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = Math.max(1, U * 0.002);
      ctx.beginPath();
      ctx.moveTo(x - s, y);
      ctx.lineTo(x + s, y);
      ctx.moveTo(x, y - s);
      ctx.lineTo(x, y + s);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Empties the canvas and drops the plant (used when there is nothing to show).
  clear() {
    this.rt = null;
    this.record = null;
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
  }

  // Called by the Loop. Advances growth, then draws.
  update(t, dt) {
    if (this.grow < 1) this.grow = Math.min(1, this.grow + dt / this.growDuration);
    this.drawFrame(t, this.grow);
  }

  // Star motes that burst from the plant. Drawn by the effects layer.
  burst(color = '#ffe9a8') {
    const room = (this.motion < 1 ? 30 : 60) - this.particles.length;
    for (let k = 0; k < Math.min(12, room); k++) {
      const a = (TAU * k) / 12 + Math.random() * 0.4;
      const s = 0.12 + Math.random() * 0.18;
      this.particles.push({ kind: 'star', x: 0, y: -0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.05, age: 0, life: 1.4, color });
    }
  }

  start() {
    Loop.add(this);
  }

  stop() {
    Loop.remove(this);
  }
}

// Aura behind the plant, in the glow gene's color. It breathes slowly.
function drawAura(ctx, color, cx, cy, U, t) {
  const rad = U * 0.75;
  const rgb = hexToRgb(color);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
  g.addColorStop(0, rgbStr(rgb, 0.22 + 0.06 * Math.sin(t * 1.3)));
  g.addColorStop(1, rgbStr(rgb, 0));
  ctx.fillStyle = g;
  ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
}

// Hybrid aura: two overlapping halos in the parents' colors, with motes that orbit the plant.
function drawHybridAura(ctx, colors, cx, cy, U, t) {
  const rad = U * 0.62;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 2; k++) {
    const a = t * 0.25 + k * Math.PI;
    const x = cx + Math.cos(a) * U * 0.12;
    const y = cy + Math.sin(a) * U * 0.12;
    const rgb = hexToRgb(colors[k]);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, rgbStr(rgb, 0.16));
    g.addColorStop(1, rgbStr(rgb, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  for (let m = 0; m < 10; m++) {
    const a = t * 0.6 + (TAU * m) / 10;
    const r = U * (0.35 + 0.12 * Math.sin(t * 0.9 + m));
    ctx.fillStyle = rgbStr(hexToRgb(colors[m % 2]), 0.55);
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.6, Math.max(1, U * 0.006), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

// Light rays: three translucent wedges falling from above the plant, drifting slowly.
function drawRays(ctx, U, baseX, baseY, t) {
  const sx = baseX - U * 0.9;
  const sy = baseY - U * 2.2;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 3; k++) {
    const tx = baseX + (k - 1) * U * 0.35 + Math.sin(t * 0.15 + k * 1.9) * U * 0.08;
    const ty = baseY - U * 0.9;
    const g = ctx.createLinearGradient(sx, sy, tx, ty);
    g.addColorStop(0, 'rgba(255,240,190,0.1)');
    g.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(tx - U * 0.12, ty);
    ctx.lineTo(tx + U * 0.12, ty);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// Point at fraction t along node i, in device px, with the node's unit direction and normal.
function nodePoint(geo, i, t, U, baseX, baseY) {
  const x0 = baseX + geo.SX[i] * U;
  const y0 = baseY + geo.SY[i] * U;
  const x1 = baseX + geo.EX[i] * U;
  const y1 = baseY + geo.EY[i] * U;
  const len = Math.hypot(x1 - x0, y1 - y0) || 1;
  const ux = (x1 - x0) / len;
  const uy = (y1 - y0) / len;
  return { x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, ux, uy, nx: -uy, ny: ux };

// Roots, vines, mushrooms, thorns, and crystal veins, drawn from node poses. They sit behind the foliage.
function drawStructures(ctx, L, geo, traits, U, baseX, baseY, t, motion) {
  const trunk = L.nodes[L.trunkChain[0]];
  const hw = Math.max(1, trunk.w0 * U * 0.5);

    ctx.moveTo(baseX - b.side * hw * 0.2, baseY - hw * 0.3);
    ctx.lineTo(baseX + b.side * (hw + b.length * U), baseY + U * 0.004);

    ctx.fill();

    ctx.moveTo(p.x, p.y);
    ctx.quadraticCurveTo(p.x + r.bend * U * 0.5, p.y + r.len * U * 0.55, ex, ey);

      ctx.strokeStyle = 'rgba(98,160,82,0.85)';
      ctx.beginPath();
      for (let k = 0; k <= 32; k++) {

        const pos = f * (chain.length - 1e-6);
        const idx = Math.floor(pos);
        const node = chain[idx];
        const p = nodePoint(geo, node, pos - idx, U, baseX, baseY);
        const off = Math.sin(f * TAU * 2.2 + L.vine.phase + s * 2.1 + t * 0.4 * motion) * L.nodes[node].w0 * U * 0.7 * (s % 2 ? -1 : 1);
        const x = p.x + p.nx * off;
        const y = p.y + p.ny * off;
        if (k === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

    if (geo.GP[m.n] < 0.5) continue;
    const p = nodePoint(geo, m.n, m.t, U, baseX, baseY);
    const hw = L.nodes[m.n].w0 * U * 0.5;
    const cx = p.x + p.nx * m.side * hw * 1.2;
    const cy = p.y + p.ny * m.side * hw * 1.2;
    const r = Math.max(2, m.size * U * 0.012);
    ctx.fillStyle = 'rgba(240,230,205,0.95)';
    ctx.fillRect(cx - r * 0.2, cy, r * 0.4, r * 0.9);
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = 'rgba(214,126,90,0.9)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.4, cy - r * 0.4, r * 0.18, 0, TAU);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(56,38,24,0.9)';
  for (const th of L.thorns) {
    if (geo.GP[th.n] < 0.5) continue;
    const nd = L.nodes[th.n];

    const by = p.y + p.ny * th.side * hw;

    ctx.moveTo(bx - p.ux * s * 0.6, by - p.uy * s * 0.6);
    ctx.lineTo(bx + p.nx * th.side * s + p.ux * s * 0.3, by + p.ny * th.side * s + p.uy * s * 0.3);
    ctx.lineTo(bx + p.ux * s * 0.6, by + p.uy * s * 0.6);
    ctx.closePath();
    ctx.fill();
  }

  if (traits.crystalline.v >= 2) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = traits.crystalline.v === 3 ? 'rgba(170,240,255,0.5)' : 'rgba(170,240,255,0.28)';
    ctx.lineWidth = Math.max(1, U * 0.005);
    for (const i of L.trunkChain) {
      if (geo.GP[i] < 0.5) continue;
      const off = L.nodes[i].w0 * U * 0.2;
      const p0 = nodePoint(geo, i, 0, U, baseX, baseY);
      const p1 = nodePoint(geo, i, 1, U, baseX, baseY);
      ctx.beginPath();
      ctx.moveTo(p0.x + p0.nx * off, p0.y + p0.ny * off);
      ctx.lineTo(p1.x + p1.nx * off, p1.y + p1.ny * off);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// A new particle, in the canopy (or near the base for spores). Positions are in world units.
function spawnParticle(kind, L) {

// Thumbnails: static 220 px plants as WebP data URLs (PNG where WebP is unavailable). Keeps the 150 most recent.
const THUMB_CACHE = new Map();
const THUMB_LIMIT = 150;

function renderThumb(record) {
  const hit = THUMB_CACHE.get(record.id);
  if (hit) {
    THUMB_CACHE.delete(record.id);
    THUMB_CACHE.set(record.id, hit);
    return hit;
  }
  const canvas = document.createElement('canvas');
  const view = new PlantView(canvas, { width: 220, height: 220, dpr: 1, thumb: true });
  view.motion = 0;
  view.setPlant(record, { animate: false });
  view.drawFrame(0, 1);
  const url = canvas.toDataURL('image/webp', 0.9);
  THUMB_CACHE.set(record.id, url);
  if (THUMB_CACHE.size > THUMB_LIMIT) THUMB_CACHE.delete(THUMB_CACHE.keys().next().value);
  return url;
}

/* ---------- Loop: one requestAnimationFrame loop for every active viewer ---------- */
const Loop = (() => {

    add(viewer) {

    remove(viewer) {

  return r.genes.every((v, i) => Number.isInteger(v) && v >= 0 && v < GENES[i].alleles.length);

// Fill optional fields with defaults, so later code can rely on them.

  return {
    id: r.id,
    name: r.name.trim().slice(0, 40) || 'Unnamed specimen',
    genus: { pre: r.genus.pre, suf: r.genus.suf },
    genes: r.genes.slice(),
    createdAt: Number.isFinite(r.createdAt) ? r.createdAt : 0,
    fav: r.fav === true,
    gen: Number.isInteger(r.gen) && r.gen >= 0 ? r.gen : 0,

const Store = {
  plants: [], // newest first
  settings: { haptics: true, particles: true },
  memoryOnly: false,

  load() {
    let raw = null;
    try {
      raw = localStorage.getItem(STORE_KEY);
    } catch (err) {
      this.memoryOnly = true;
      showToast(SAVE_FAILED_TEXT);
      return;
    }
    if (!raw) return;
    let data = null;
    try {
      data = JSON.parse(raw);
    } catch (err) {
      showToast('Saved data could not be read, so the garden starts fresh.');
      return;
    }
    if (!data || typeof data !== 'object') {
      showToast('Saved data could not be read, so the garden starts fresh.');
      return;
    }
    if (data.settings && typeof data.settings === 'object') {
      this.settings.haptics = data.settings.haptics !== false;
      this.settings.particles = data.settings.particles !== false;
    }
    const seen = new Set();
    let dropped = 0;
    for (const r of Array.isArray(data.plants) ? data.plants : []) {
      if (isUsableRecord(r) && !seen.has(r.id)) {
        seen.add(r.id);
        this.plants.push(normalizeRecord(r));

        dropped++;

  save() {
    const payload = JSON.stringify({ version: STORE_VERSION, plants: this.plants, settings: this.settings });

      localStorage.setItem(STORE_KEY, payload);
      this.memoryOnly = false;
    } catch (err) {
      if (!this.memoryOnly) showToast(SAVE_FAILED_TEXT);
      this.memoryOnly = true;
    }
  },

    return this.plants.slice();

  get(id) {
    return this.plants.find((p) => p.id === id) || null;

  add(record) {
    const existing = this.get(record.id);
    if (existing) return existing;
    this.plants.unshift(record);
    this.save();
    return record;
  },

  update(id, patch) {
    const record = this.get(id);
    if (!record) return null;
    if (typeof patch.name === 'string') record.name = patch.name;
    if (typeof patch.fav === 'boolean') record.fav = patch.fav;

    return record;

  remove(id) {

    if (i < 0) return false;
    this.plants.splice(i, 1);
    this.save();
    return true;

// Lab drawings. A sprout grows for a generation, and a DNA ladder lights up for a hybridization. p is progress.
function drawLab(ctx, kind, p, w, h, dpr) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2;
  if (kind === 'hybridize') {
    const top = h * 0.06;
    const bottom = h * 0.94;
    const amp = w * 0.2;
    const now = performance.now() / 600;
    for (let k = 0; k < GENE_COUNT; k++) {
      const f = k / (GENE_COUNT - 1);
      const y = top + (bottom - top) * f;
      const ph = f * Math.PI * 4 + now;
      const xa = cx + Math.sin(ph) * amp;
      const xb = cx - Math.sin(ph) * amp;
      const lit = (k + 1) / GENE_COUNT <= p;
      ctx.strokeStyle = lit ? 'rgba(233, 201, 119, 0.9)' : 'rgba(233, 201, 119, 0.16)';
      ctx.lineWidth = 2 * dpr;
      ctx.beginPath();
      ctx.moveTo(xa, y);
      ctx.lineTo(xb, y);
      ctx.stroke();
      ctx.fillStyle = lit ? '#7fd3b5' : 'rgba(127, 211, 181, 0.28)';
      ctx.beginPath();
      ctx.arc(xa, y, 3.2 * dpr, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(xb, y, 3.2 * dpr, 0, TAU);
      ctx.fill();
    }
    return;
  }
  const baseY = h * 0.84;
  const grow = Math.min(1, p * 1.2);
  const stem = grow * h * 0.56;
  const glow = ctx.createRadialGradient(cx, baseY, 0, cx, baseY, w * 0.45);
  glow.addColorStop(0, `rgba(233, 201, 119, ${0.25 * (1 - grow)})`);
  glow.addColorStop(1, 'rgba(233, 201, 119, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(92, 64, 38, 0.7)';
  ctx.beginPath();
  ctx.ellipse(cx, baseY + 4 * dpr, w * 0.2, 9 * dpr, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#86e09a';
  ctx.lineWidth = 3 * dpr;
  ctx.beginPath();
  ctx.moveTo(cx, baseY);
  ctx.quadraticCurveTo(cx + 8 * dpr, baseY - stem * 0.5, cx, baseY - stem);
  ctx.stroke();
  const leaves = grow > 0.4 ? Math.min(1, (grow - 0.4) / 0.6) : 0;
  for (const side of [-1, 1]) {
    const ly = baseY - stem * (side < 0 ? 0.55 : 0.75);
    ctx.fillStyle = 'rgba(134, 224, 154, 0.85)';
    ctx.beginPath();
    ctx.ellipse(cx + side * 22 * dpr * leaves, ly, 22 * dpr * leaves, 9 * dpr * leaves, side * -0.5, 0, TAU);
    ctx.fill();
  }
}

// Progress overlay for a generation or a hybridization. Resolves when the animation ends, or after a tap past 0.3 s.
// For hybridization, opts.parents holds the two parent records and their thumbnails slide toward the center.
function openLab(kind, opts = {}) {
  const hybrid = kind === 'hybridize';
  const duration = hybrid ? 1.4 : 0.9;
  const overlay = $('overlay-lab');
  const canvas = $('labCanvas');
  const parentA = $('labParentA');
  const parentB = $('labParentB');
  const dual = hybrid && Array.isArray(opts.parents) && opts.parents.length === 2;
  $('labKicker').textContent = hybrid ? 'Splicing' : 'Germinating';
  $('labTitle').textContent = dual ? `${opts.parents[0].name} × ${opts.parents[1].name}` : 'Sampling a new genome';
  parentA.hidden = !dual;
  parentB.hidden = !dual;
  if (dual) {
    parentA.src = renderThumb(opts.parents[0]);
    parentB.src = renderThumb(opts.parents[1]);
  }
  overlay.hidden = false;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(Math.max(1, rect.width || 260) * dpr);
  canvas.height = Math.round(Math.max(1, rect.height || 240) * dpr);
  const ctx = canvas.getContext('2d');
  const start = performance.now();
  return new Promise((resolve) => {
    let finished = false;
    let backstop = 0;
    const finish = () => {
      if (finished) return;
      finished = true;
      clearTimeout(backstop);
      Loop.remove(viewer);
      overlay.removeEventListener('pointerdown', skip);
      overlay.hidden = true;
      resolve();
    };
    const skip = () => {
      if (performance.now() - start >= 300) finish();
    };
    const viewer = {
      update() {
        const p = Math.min(1, (performance.now() - start) / 1000 / duration);
        drawLab(ctx, hybrid ? 'hybridize' : 'generate', p, canvas.width, canvas.height, dpr);
        $('labBar').style.width = `${Math.round(p * 100)}%`;
        const genes = Math.min(GENE_COUNT, Math.round(p * GENE_COUNT));
        $('labCount').textContent = `${hybrid ? 'Splicing' : 'Sampling'} genes ${genes} / ${GENE_COUNT}`;
        if (dual) {
          const shift = (1 - p) * 42;
          parentA.style.transform = `translateX(${shift}px)`;
          parentB.style.transform = `translateX(${-shift}px)`;
        }
        if (p >= 1) finish();
      },
    };
    overlay.addEventListener('pointerdown', skip);
    Loop.add(viewer);
    // Frames can arrive late on slow devices. This timer ends the lab on time regardless.
    backstop = setTimeout(finish, duration * 1000 + 40);
  });
}

/* ---------- Gallery: grid, search, filters, sorting, and card actions ---------- */
const galleryState = { query: '', filter: 'all', sort: 'newest', pageSize: 48, shown: 48, breed: false };

const breedState = { parents: [] };

  ['pure', 'Pure'],

const SORTS = {
  newest: (a, b) => b.createdAt - a.createdAt,
  oldest: (a, b) => a.createdAt - b.createdAt,
  rarest: (a, b) => analysisOf(b).score - analysisOf(a).score,
  common: (a, b) => analysisOf(a).score - analysisOf(b).score,
  name: (a, b) => a.name.localeCompare(b.name),
  generation: (a, b) => b.gen - a.gen || b.createdAt - a.createdAt,
};

// Analysis depends only on the genes, so each record is analyzed once.
function analysisOf(record) {
  let analysis = analysisCache.get(record.id);
  if (!analysis) {
    analysis = analyze(record.genes);
    analysisCache.set(record.id, analysis);
  }
  return analysis;
}

function isHybrid(record) {
  return record.gen > 0 || Boolean(record.parents);

  if (filter === 'hybrid') return isHybrid(record);
